---
- name: CIFS | Inicializar publicação de anexos
  ansible.builtin.set_fact:
    csd_cifs_report_upload_failed: false
    csd_cifs_report_upload_error: ""
    send_mail_cifs_remote_files: []
    send_mail_attachments: []
    csd_cifs_stored_filename: ""

- name: CIFS | Publicar anexo CSV/TAR.GZ via smbclient
  when: csd_cifs_enabled | bool
  block:
    - name: CIFS | Resolver compartilhamento e arquivo de senha
      ansible.builtin.set_fact:
        _csd_report_cifs_server: "{{ (csd_cifs_address | default({})).get(csd_cifs_label | default('') | lower, '') }}"
        _csd_report_cifs_dir: "{{ csd_cifs_attachment_path | default('/Ansible/mail_attachments') }}"
        _csd_report_cifs_pass_file: "{{ csd_controller_tmp_dir }}/.cifs-pass"
      no_log: true

    - name: CIFS | Criar diretório temporário no host delegado
      ansible.builtin.file:
        path: "{{ csd_controller_tmp_dir }}"
        state: directory
        mode: "0700"
      delegate_to: "192.168.122.34"
      become: false

    - name: CIFS | Copiar anexo para host delegado
      ansible.builtin.copy:
        src: "{{ csd_attachment_path }}"
        dest: "{{ csd_controller_tmp_dir }}/{{ csd_attachment_filename }}"
        mode: "0644"
      delegate_to: "192.168.122.34"
      become: false

    - name: CIFS | Validar compartilhamento configurado
      ansible.builtin.fail:
        msg: "CIFS não mapeado para relatório: csd_cifs_label={{ csd_cifs_label }}"
      when: _csd_report_cifs_server | length == 0

    - name: CIFS | Criar arquivo temporário de senha CIFS
      ansible.builtin.copy:
        dest: "{{ _csd_report_cifs_pass_file }}"
        content: "{{ ansible_password | default('') }}"
        mode: "0600"
      delegate_to: "192.168.122.34"
      become: false
      no_log: true

    - name: CIFS | Testar acesso ao CIFS
      ansible.builtin.shell: >
        smbclient "{{ _csd_report_cifs_server }}"
        -U "{{ ansible_user }}%$(cat {{ _csd_report_cifs_pass_file }})"
        -W "{{ csd_cifs_workgroup }}"
        -c "cd {{ _csd_report_cifs_dir }} ; ls"
      register: _csd_report_cifs_probe
      retries: 5
      delay: 10
      until: _csd_report_cifs_probe.rc == 0
      changed_when: false
      delegate_to: "192.168.122.34"
      become: false
      no_log: true

    - name: CIFS | Enviar anexo para CIFS
      ansible.builtin.shell: >
        smbclient "{{ _csd_report_cifs_server }}"
        -U "{{ ansible_user }}%$(cat {{ _csd_report_cifs_pass_file }})"
        -W "{{ csd_cifs_workgroup }}"
        -c 'cd {{ _csd_report_cifs_dir }} ; put {{ csd_controller_tmp_dir }}/{{ csd_attachment_filename }} {{ csd_attachment_filename }}'
      register: _csd_report_cifs_put
      changed_when: true
      delegate_to: "192.168.122.34"
      become: false
      no_log: true

    - name: CIFS | Publicar nomes de anexos para o Workflow
      ansible.builtin.set_fact:
        csd_cifs_stored_filename: "{{ csd_attachment_filename }}"
        send_mail_cifs_remote_files: >-
          {{ [csd_attachment_filename] if (csd_attachment_email_allowed | bool) else [] }}
        send_mail_attachments: >-
          {{ [csd_attachment_filename] if (csd_attachment_email_allowed | bool) else [] }}

  rescue:
    - name: CIFS | Registrar falha de publicação
      ansible.builtin.set_fact:
        csd_cifs_report_upload_failed: true
        csd_cifs_report_upload_error: "Falha ao publicar anexo no CIFS; conferir o Job de descoberta."
        csd_cifs_stored_filename: ""
        send_mail_cifs_remote_files: []
        send_mail_attachments: []

  always:
    - name: CIFS | Remover arquivo temporário de senha
      ansible.builtin.file:
        path: "{{ csd_controller_tmp_dir }}/.cifs-pass"
        state: absent
      delegate_to: "192.168.122.34"
      become: false
      failed_when: false
      no_log: true

    - name: CIFS | Remover anexo temporário e diretório de estágio
      ansible.builtin.file:
        path: "{{ csd_controller_tmp_dir }}"
        state: absent
      delegate_to: "192.168.122.34"
      become: false
      failed_when: false
      no_log: true

- name: CIFS | Sem CIFS, não publicar anexos remotos
  ansible.builtin.set_fact:
    csd_cifs_stored_filename: ""
    send_mail_cifs_remote_files: []
    send_mail_attachments: []
  when: not (csd_cifs_enabled | bool)
