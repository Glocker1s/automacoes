---
# Quay Sync Manager
# Modos:
#   check -> descobre repository mirrors, compara PRD x DR por tag/digest e reporta.
#   sync  -> executa check, aplica sync-cancel + sync-now nos candidatos e revalida.

quay_mode: "check" # check | sync
motivo: "Validação de mirror Quay PRD x DR"

quay_source:
  name: "PRD"
  url: "https://quay-registry.apps.agcticosprocp.ocp.agorasenior.corp"
  token: "{{ quay_token_prd }}"
  validate_certs: false

quay_target:
  name: "DR"
  url: "https://quay-registry.apps.agalpcosdrocp.ocp.agorasenior.corp"
  token: "{{ quay_token_dr }}"
  validate_certs: false

# A automação descobre automaticamente os repositories MIRROR dentro desses namespaces.
quay_discovery_namespaces:
  - ansible

# Paginação/limites.
# O endpoint de tags usa page/limit.
# A automação consulta até quay_max_pages, mas por padrão para automaticamente
# quando uma página retorna menos itens que quay_tag_page_limit.
quay_repository_page_limit: 100
quay_repository_max_pages: 50
quay_fail_on_repository_pagination_limit_reached: true

quay_tag_page_limit: 100
quay_max_pages: 10

quay_api_timeout: 120

# Retry para consultas de tags.
# Erros transitórios não derrubam a execução; após esgotar as tentativas,
# o repository é registrado como TAG_COLLECTION_ERROR.
quay_tag_request_retries: 3
quay_tag_request_retry_delay: 10

# Paginação inteligente de tags.
# true:
#   page 1 retornou 5 tags com limit=100 -> não consulta page 2.
#   page 1 retornou 100 tags com limit=100 -> consulta page 2.
# false:
#   consulta todas as páginas até quay_max_pages
quay_tag_pagination_stop_when_page_not_full: true

# Debug operacional.
# false evita imprimir detalhes de todos os mirrors no log do AAP.
quay_debug_enabled: false

# Segurança de logs.
quay_hide_sensitive_logs: false

# Diretórios/arquivos locais no controller/AAP.
quay_job_id: "{{ tower_job_id | default(awx_job_id | default('local')) }}"
quay_output_dir: "/tmp/quay-sync-manager-{{ quay_job_id }}"
quay_result_file: "{{ quay_output_dir }}/quay_result.json"
quay_initial_json_file: "{{ quay_output_dir }}/quay_compare_initial.json"
quay_final_json_file: "{{ quay_output_dir }}/quay_compare_final.json"
quay_sync_actions_file: "{{ quay_output_dir }}/quay_sync_actions.json"

# Sync nativo do Quay.
quay_sync_cancel_before_now: true
quay_sync_wait_after_trigger_seconds: 20
quay_sync_retries: 10
quay_sync_delay: 30
quay_sync_candidate_statuses:
  - MISSING_TAG
  - DIGEST_MISMATCH
  - DIGEST_UNAVAILABLE

# Falha formal do job.
# Divergências de conteúdo por padrão só alertam no relatório.
# Erros de API/token/conexão entram no bloco rescue e geram e-mail de falha.
quay_fail_job_on_divergence: false

# Relatório.
quay_report_timezone: "America/Sao_Paulo"
quay_report_title: "Quay Sync Manager"
quay_report_subject_prefix: "Ansible-Report"
quay_report_max_rows: 200

# Quantos namespaces aparecem no cabeçalho do e-mail.
# Se houver mais namespaces, o report mostra "+N".
quay_report_namespace_preview_limit: 5

# Exibir ou ocultar a tabela detalhada de configuração dos mirrors.
quay_report_show_mirror_config: false

# Quando quay_report_show_mirror_config=true, limita quantas linhas aparecem.
quay_report_mirror_config_max_rows: 30

# Exibir linhas OK na tabela de comparação.
# false = mostra apenas divergências/atenções.
# true  = mostra tudo, incluindo OK.
quay_report_show_ok_rows: false

# Ocultar status considerados ruído operacional no e-mail.
# A comparação completa continua salva no JSON local.
quay_report_hide_noise_statuses: true

# Status ocultados do relatório quando quay_report_hide_noise_statuses=true.
# SOURCE_REPOSITORY_EMPTY_OR_INACCESSIBLE:
#   Repo mirror existe no DR, mas nenhuma tag foi retornada no PRD.
# TAG_COLLECTION_ERROR permanece visível no relatório para indicar que o
# repository não pôde ser validado, mas não derruba o job por si só.
quay_report_noise_statuses:
  - SOURCE_REPOSITORY_EMPTY_OR_INACCESSIBLE

# Quando true, os status ocultados também não impactam o nível do e-mail.
# Exemplo: SOURCE_REPOSITORY_EMPTY_OR_INACCESSIBLE ocultado não eleva o nível do e-mail.
quay_report_ignore_noise_statuses_for_level: true

# Anexos do e-mail.
# Por padrão, a automação envia o relatório HTML no corpo do e-mail e NÃO anexa JSON
quay_report_attach_artifacts: false

# Upload de anexos via CIFS para integração com job de e-mail.
# Só será usado quando quay_report_attach_artifacts=true.
quay_report_cifs_upload_enabled: false
quay_report_cifs_delegate: "localhost"
quay_report_cifs_stage_dir: "/tmp/quay-sync-cifs-{{ quay_job_id }}"

send_mail_cifs: "producao"
send_mail_cifs_path: "/Ansible/mail_attachments"
send_mail_cifs_address:
  tutihofix: "//AG-AH-VV-FS-001.agorasenior.corp/Apps"
  producao: "//AG-MZ-VV-FS-002.corp.bradesco.com.br/Apps"
cifs_workgroup: "agorasenior.corp"

# Criação automática de mirrors ausentes no DR.
# Em modo check apenas identifica e reporta.
# Em modo sync, quando true, cria os repositories/mirrors ausentes.
quay_auto_create_missing_mirrors: true

# Repository criado automaticamente no DR.
quay_auto_mirror_repository_visibility: "private"
quay_auto_mirror_repository_description: "Mirror criado automaticamente pelo Quay Sync Manager"

# Registry PRD usado como origem dos novos mirrors.
# O repository será acrescentado automaticamente: <prefix>/<namespace>/<repository>.
quay_auto_mirror_external_reference_prefix: >-
  {{ quay_source.url | regex_replace('^https?://', '') | regex_replace('/+$', '') }}

# Credencial padrão utilizada pelo Quay DR para fazer pull do PRD.
quay_auto_mirror_source_username: "{{ quay_username }}"
quay_auto_mirror_source_password: "{{ quay_password }}"
quay_auto_mirror_source_credentials_required: true

# Configuração padrão dos novos mirrors.
quay_auto_mirror_enabled: true
quay_auto_mirror_sync_interval: 86400
quay_auto_mirror_skopeo_timeout_interval: 600

quay_auto_mirror_root_rule:
  rule_kind: "tag_glob_csv"
  rule_value:
    - "*"

quay_auto_mirror_external_registry_config: {}

# Robot account do DR.
# O username final será <namespace>+<short_name>.
quay_auto_mirror_robot_short_name: "mirror"
quay_auto_mirror_robot_auto_create: true
quay_auto_mirror_robot_description: "Robot utilizado pelo Quay Sync Manager"
quay_auto_mirror_robot_repository_role: "write"

# Repositories que existem no PRD e no DR, mas propositalmente
# não devem possuir state MIRROR no DR.
# Informar sempre no formato <namespace>/<repository>.
quay_target_non_mirror_exceptions:
  - "ansible/health-check"
