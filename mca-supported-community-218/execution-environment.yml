---
# EE unificado: RHEL 9 / Python 3.12 / ansible-core 2.18
# Preparar files/oc e files/kubectl ANTES de executar o build.
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.18

dependencies:
  # A imagem-base oficial ja contem ansible-core 2.18 e ansible-runner.
  # Nao reinstalar ansible-core por pip (evita desalinhar com a base Red Hat).
  python_interpreter:
    python_path: /usr/bin/python3.12
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

# Os binarios OpenShift ficam fora do projeto ate a etapa de preparacao.
# Esses caminhos sao incluidos no contexto local do build.
additional_build_files:
  - src: files/oc
    dest: openshift
  - src: files/kubectl
    dest: openshift

additional_build_steps:
  prepend_galaxy:
    # Red Hat Certified Content + Galaxy community content.
    # O token vem de ARG em tempo de build; nunca colocar em ENV ou no Git.
    - ENV ANSIBLE_GALAXY_SERVER_LIST=automation_hub,galaxy
    - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_URL=https://console.redhat.com/api/automation-hub/content/published/
    - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_AUTH_URL=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    - ENV ANSIBLE_GALAXY_SERVER_GALAXY_URL=https://galaxy.ansible.com/
    - ARG ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN
  append_final:
    - COPY _build/openshift/oc /usr/local/bin/oc
    - COPY _build/openshift/kubectl /usr/local/bin/kubectl
    - RUN chmod 0755 /usr/local/bin/oc /usr/local/bin/kubectl
    - RUN /usr/local/bin/oc version --client
    - RUN /usr/local/bin/kubectl version --client

options:
  package_manager_path: /usr/bin/microdnf
