---
# A desmontagem é feita apenas quando o próprio job executou o mount.
# Nunca remover a pasta montada enquanto o compartilhamento continuar ativo.
- name: CIFS | Desmontar compartilhamento utilizado pela execução
  ansible.builtin.command:
    argv: [umount, "{{ f5_backup_cifs_mount_path }}"]
  delegate_to: "{{ f5_backup_cifs_delegate_host }}"
  become: true
  register: _f5_cifs_umount_result
  changed_when: _f5_cifs_umount_result.rc == 0
  failed_when: false
  when: f5_backup_cifs_mounted_by_job | default(false) | bool

- name: CIFS | Marcar mount como encerrado após umount bem-sucedido
  ansible.builtin.set_fact:
    f5_backup_cifs_mounted_by_job: false
  changed_when: false
  when:
    - _f5_cifs_umount_result is defined
    - not (_f5_cifs_umount_result.skipped | default(false) | bool)
    - (_f5_cifs_umount_result.rc | default(1) | int) == 0

- name: CIFS | Registrar falha de desmontagem
  ansible.builtin.set_fact:
    f5_global_errors: >-
      {{ f5_global_errors + [{
        'stage': 'Cleanup / CIFS',
        'task': 'Desmontar compartilhamento',
        'message': 'Não foi possível desmontar ' ~ f5_backup_cifs_mount_path ~ ': ' ~ (_f5_cifs_umount_result.stderr | default('erro de umount'))
      }] }}
  changed_when: false
  when:
    - _f5_cifs_umount_result is defined
    - not (_f5_cifs_umount_result.skipped | default(false) | bool)
    - (_f5_cifs_umount_result.rc | default(0) | int) != 0

- name: CIFS | Checar se o mount ainda está ativo
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ f5_backup_cifs_mount_path }}"]
  delegate_to: "{{ f5_backup_cifs_delegate_host }}"
  become: true
  register: _f5_cifs_mount_after
  changed_when: false
  failed_when: false
  when: f5_backup_cifs_mount_path is defined

- name: CIFS | Remover ponto de montagem vazio após desmontagem
  ansible.builtin.command:
    argv: [rmdir, "{{ f5_backup_cifs_mount_path }}"]
  delegate_to: "{{ f5_backup_cifs_delegate_host }}"
  become: true
  changed_when: false
  failed_when: false
  when:
    - _f5_cifs_mount_after is defined
    - not (_f5_cifs_mount_after.skipped | default(false) | bool)
    - (_f5_cifs_mount_after.rc | default(0) | int) != 0

- name: CIFS | Remover arquivo de credenciais temporárias
  ansible.builtin.file:
    path: "{{ f5_backup_cifs_credentials_file }}"
    state: absent
  delegate_to: "{{ f5_backup_cifs_delegate_host }}"
  become: true
  changed_when: false
  failed_when: false
  no_log: true
  when: f5_backup_cifs_credentials_file is defined

- name: Remover staging temporário do host Linux
  ansible.builtin.file:
    path: "{{ f5_backup_remote_temp_dir }}"
    state: absent
  delegate_to: "{{ f5_backup_cifs_delegate_host }}"
  become: false
  changed_when: false
  failed_when: false

- name: Remover diretório local de UCS no EE
  ansible.builtin.file:
    path: "{{ f5_backup_local_temp_dir }}"
    state: absent
  delegate_to: localhost
  changed_when: false
  failed_when: false
