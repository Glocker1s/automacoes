---
- name: Definir contexto de backup de {{ backup_device.hostname | default(backup_device.server) }}
  ansible.builtin.set_fact:
    _backup_hostname: "{{ backup_device.hostname | default(backup_device.server) }}"
    _backup_provider: >-
      {{
        f5_provider_base
        | combine({
            'server': backup_device.server,
            'server_port': (backup_device.port | int),
            'timeout': (f5_backup_transfer_timeout | int)
          })
      }}
    _backup_ucs_name: >-
      {{ backup_device.hostname | default(backup_device.server) }}_{{ _site_environment | upper }}_{{ f5_backup_timestamp }}.ucs
  changed_when: false

- name: Definir caminhos do backup
  ansible.builtin.set_fact:
    _backup_local_file: "{{ f5_backup_local_temp_dir }}/{{ _backup_ucs_name }}"
    _backup_remote_stage_file: "{{ f5_backup_remote_temp_dir }}/{{ _backup_ucs_name }}"
    _backup_cifs_dir: "{{ _f5_cifs_root_dir }}/{{ _site_environment | upper }}/{{ _backup_hostname }}"
    _backup_cifs_file: >-
      {{ _f5_cifs_server }}{{ f5_backup_cifs_path | regex_replace('/$', '') }}/{{ _site_environment | upper }}/{{ _backup_hostname }}/{{ _backup_ucs_name }}
    _backup_cifs_local_file: "{{ _f5_cifs_root_dir }}/{{ _site_environment | upper }}/{{ _backup_hostname }}/{{ _backup_ucs_name }}"
    _backup_cifs_partial_file: >-
      {{ _f5_cifs_root_dir }}/{{ _site_environment | upper }}/{{ _backup_hostname }}/.{{ _backup_ucs_name }}.partial-{{ awx_job_id | default('local') }}
  changed_when: false

- name: Inicializar controle de publicação do UCS
  ansible.builtin.set_fact:
    _backup_cifs_published_by_job: false
  changed_when: false

- name: Criar e publicar UCS de {{ _backup_hostname }}
  block:
    - name: Salvar running-config antes do UCS
      f5networks.f5_modules.bigip_config:
        save: true
        provider: "{{ _backup_provider }}"
      delegate_to: localhost

    - name: Criar e baixar UCS para área temporária
      f5networks.f5_modules.bigip_ucs_fetch:
        src: "{{ _backup_ucs_name }}"
        dest: "{{ _backup_local_file }}"
        create_on_missing: true
        fail_on_missing: false
        force: true
        async_timeout: "{{ f5_backup_async_timeout | int }}"
        mode: "0600"
        provider: "{{ _backup_provider }}"
      delegate_to: localhost
      register: _backup_ucs_fetch

    - name: Validar UCS baixado localmente
      ansible.builtin.stat:
        path: "{{ _backup_local_file }}"
      delegate_to: localhost
      register: _backup_local_stat
      failed_when: >-
        not (_backup_local_stat.stat.exists | default(false) | bool) or
        ((_backup_local_stat.stat.size | default(0) | int) <= 0)

    - name: Transferir UCS para staging do host
      ansible.builtin.copy:
        src: "{{ _backup_local_file }}"
        dest: "{{ _backup_remote_stage_file }}"
        mode: "0600"
        force: true
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: false

    - name: CIFS | Criar pastas de ambiente e equipamento
      ansible.builtin.command:
        argv: [mkdir, -p, "{{ _backup_cifs_dir }}"]
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      changed_when: false

    - name: CIFS | Proteger backup contra sobrescrita
      ansible.builtin.stat:
        path: "{{ _backup_cifs_local_file }}"
        get_checksum: false
        get_attributes: false
        get_mime: false
      register: _backup_existing_destination
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true

    - name: CIFS | Validar nome livre para novo UCS
      ansible.builtin.assert:
        that:
          - not (_backup_existing_destination.stat.exists | default(false) | bool)
        fail_msg: >-
          Backup {{ _backup_cifs_file }} já existe. Não será sobrescrito.

    - name: CIFS | Copiar UCS do staging para arquivo parcial
      ansible.builtin.command:
        argv: [cp, -f, --, "{{ _backup_remote_stage_file }}", "{{ _backup_cifs_partial_file }}"]
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      changed_when: true

    - name: CIFS | Verificar arquivo no staging
      ansible.builtin.stat:
        path: "{{ _backup_remote_stage_file }}"
        get_checksum: false
        get_attributes: false
        get_mime: false
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      register: _backup_stage_stat

    - name: CIFS | Verificar cópia parcial no compartilhamento
      ansible.builtin.stat:
        path: "{{ _backup_cifs_partial_file }}"
        get_checksum: false
        get_attributes: false
        get_mime: false
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      register: _backup_partial_stat

    - name: CIFS | Validar tamanho do UCS copiado
      ansible.builtin.assert:
        that:
          - _backup_partial_stat.stat.exists | default(false) | bool
          - (_backup_partial_stat.stat.size | default(0) | int) > 0
          - (_backup_partial_stat.stat.size | int) == (_backup_stage_stat.stat.size | int)
        fail_msg: >-
          Falha de integridade: o arquivo UCS no CIFS não possui o mesmo
          tamanho do arquivo de origem no staging. A cópia será descartada.

    - name: CIFS | Publicar arquivo UCS validado
      ansible.builtin.command:
        argv: [mv, -n, --, "{{ _backup_cifs_partial_file }}", "{{ _backup_cifs_local_file }}"]
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      changed_when: true

    - name: CIFS | Verificar se publicação deixou arquivo parcial
      ansible.builtin.stat:
        path: "{{ _backup_cifs_partial_file }}"
        get_checksum: false
        get_attributes: false
        get_mime: false
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      register: _backup_post_mv_partial

    - name: CIFS | Validar publicação sem colisão de nome
      ansible.builtin.assert:
        that:
          - not (_backup_post_mv_partial.stat.exists | default(false) | bool)
        fail_msg: >-
          Publicação não finalizada: o arquivo parcial ainda existe.
          Pode haver um backup de mesmo nome no compartilhamento.

    - name: CIFS | Registrar UCS publicado nesta execução
      ansible.builtin.set_fact:
        _backup_cifs_published_by_job: true
      changed_when: false

    - name: CIFS | Validar UCS final no compartilhamento
      ansible.builtin.stat:
        path: "{{ _backup_cifs_local_file }}"
        get_checksum: false
        get_attributes: false
        get_mime: false
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      register: _backup_final_stat
      failed_when: >-
        not (_backup_final_stat.stat.exists | default(false) | bool) or
        ((_backup_final_stat.stat.size | default(0) | int) != (_backup_stage_stat.stat.size | int))

    - name: Remover UCS temporário do BIG-IP após cópia validada
      f5networks.f5_modules.bigip_ucs:
        ucs: "{{ _backup_ucs_name }}"
        state: absent
        provider: "{{ _backup_provider }}"
      delegate_to: localhost
      register: _backup_ucs_cleanup
      failed_when: false
      when: f5_backup_remove_ucs_from_device_after_copy | bool

    - name: Registrar backup concluído
      ansible.builtin.set_fact:
        f5_backup_results: >-
          {{
            f5_backup_results + [{
              'site': _site_name,
              'environment': _site_environment,
              'server': backup_device.server,
              'hostname': _backup_hostname,
              'role': ('standalone' if not (_site_is_ha | bool) else backup_device.failover_state),
              'version': backup_device.version | default('—'),
              'sync_before': _site_sync_before | default('N/A'),
              'sync_after': _site_sync_after | default('N/A'),
              'ucs_name': _backup_ucs_name,
              'destination': _backup_cifs_file,
              'size': (_backup_local_stat.stat.size | default(0) | int),
              'status': (
                'SUCESSO COM AVISO'
                if (
                  f5_backup_remove_ucs_from_device_after_copy | bool
                  and (_backup_ucs_cleanup is defined)
                  and (_backup_ucs_cleanup.failed | default(false) | bool)
                )
                else 'SUCESSO'
              ),
              'message': (
                'Backup publicado no CIFS, porém não foi possível remover o UCS temporário do BIG-IP.'
                if (
                  f5_backup_remove_ucs_from_device_after_copy | bool
                  and (_backup_ucs_cleanup is defined)
                  and (_backup_ucs_cleanup.failed | default(false) | bool)
                )
                else 'Backup criado e publicado no CIFS.'
              )
            }]
          }}
      changed_when: false

  rescue:
    - name: CIFS | Remover cópia parcial se o backup falhou
      ansible.builtin.command:
        argv: [rm, -f, --, "{{ _backup_cifs_partial_file }}"]
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      changed_when: false
      failed_when: false
      when: _backup_cifs_partial_file is defined

    - name: CIFS | Descartar UCS final inválido criado nesta execução
      ansible.builtin.command:
        argv: [rm, -f, --, "{{ _backup_cifs_local_file }}"]
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: true
      changed_when: false
      failed_when: false
      when: _backup_cifs_published_by_job | default(false) | bool

    - name: Registrar falha do backup do membro
      ansible.builtin.set_fact:
        f5_backup_results: >-
          {{
            f5_backup_results + [{
              'site': _site_name,
              'environment': _site_environment,
              'server': backup_device.server,
              'hostname': _backup_hostname,
              'role': ('standalone' if not (_site_is_ha | bool) else backup_device.failover_state),
              'version': backup_device.version | default('—'),
              'sync_before': _site_sync_before | default('N/A'),
              'sync_after': _site_sync_after | default('N/A'),
              'ucs_name': _backup_ucs_name,
              'destination': _backup_cifs_file,
              'size': 0,
              'status': 'FALHA',
              'message': (ansible_failed_result.msg | default(ansible_failed_result | string))
            }]
          }}
      changed_when: false

  always:
    - name: Remover cópia temporária no staging do host
      ansible.builtin.file:
        path: "{{ _backup_remote_stage_file }}"
        state: absent
      delegate_to: "{{ f5_backup_cifs_delegate_host }}"
      become: false
      changed_when: false
      failed_when: false

    - name: Remover cópia temporária local do UCS
      ansible.builtin.file:
        path: "{{ _backup_local_file }}"
        state: absent
      delegate_to: localhost
      changed_when: false
      failed_when: false
