---
cm:
  postgres_manager:
    databases:
      valemobi:
      
        # Descrição apenas informativa do profile.
        description: "Valemobi PostgreSQL Manager"

        # Nome real da database PostgreSQL.
        database_name: "valemobi"

        # Ambiente usado como origem quando pgm_source_env vier vazio.
        default_source_env: "prd"

        # Destinos padrão da ação sync quando nenhum destino for informado.
        default_sync_targets:
          - "tu"
          - "ti"
          - "th"
          - "fix"
        default_restore_targets: []

        backup:
          root_dir: "/var/backup/postgres_manager"

          jobs: 16

          format: "directory"

          extra_args: ""

          validate_dump: true

        restore:

          root_dir: "/var/backup/postgres_manager_restore"
          
          mode: "restore_only"

          target_temp_suffix: "_restoring"

          old_suffix: "_old"

          no_owner: true

          no_privileges: true

          jobs: 16

          extra_args: ""

          exclude_toc_patterns:
            # O mapping é específico do destino e será recriado pelo bloco dblink.
            - "USER MAPPING"
            - "MATERIALIZED VIEW DATA"

        database_create:
          # A automação herda owner, encoding, locale, tablespace e connection limit
          # da base atual do destino e valida a criação.
          inherit_from_current: true

          validate_inheritance: true

        grants:
          capture_before_restore: true

          apply_after_restore: true

          fail_on_apply_error: false

        preserve_data:
          enabled: true
          fail_on_error: true
          run_on_envs:
            - "tu"
            - "ti"
            - "th"
            - "fix"
          groups:
            - name: "environment_configuration"
              backup_tables:
                - "public.tb_fix_server_configuration_flavour"
                - "public.tb_direct_treasury_config"
                - "public.tb_fix_server_configuration_session"
                - "public.tb_fix_server_configuration_default"
              truncate_tables:
                - "public.tb_fix_server_configuration_flavour"
                - "public.tb_direct_treasury_config"
                - "public.tb_fix_server_configuration_session"
                - "public.tb_fix_server_configuration_default"
              restore_data_only: true
              disable_triggers: true
              cascade: false
              jobs: 16

        post_restore:
          truncate_enabled: true
          fail_on_error: true
          run_on_envs:
            - "tu"
            - "ti"
            - "th"
            - "fix"
          truncate_groups:
            - name: "clear_push_investor_device_application"
              tables:
                - "public.tb_push_investor_device_application"
              cascade: false

        dblink:
          enabled: true
          run_on_envs:
            - "tu"
            - "ti"
            # - "th"
            # - "fix"
          servers:
            - name: "remote_core"
              environments:
                tu:
                  host: "10.222.84.6"
                  port: "5432"
                  dbname: "corePaqueta"
            
                ti:
                  host: "10.222.84.23"
                  port: "5432"
                  dbname: "corePaqueta"

            - name: "remote_fundos"
              environments:
                tu:
                  host: "10.222.84.6"
                  port: "5432"
                  dbname: "Fundos"

                ti:
                  host: "10.222.84.23"
                  port: "5432"
                  dbname: "Fundos"

          user_mappings:
            - server_name: "remote_core"
              local_user: "postgres"
              user_var: "dblink_user"
              password_var: "dblink_password"

          connections: []

        masking:
          # Executa o mascaramento após restore em ambientes não produtivos.
          enabled: true
          fail_on_error: true

          # Ajustar conforme os ambientes existentes para o CorePaqueta.
          run_on_envs:
            - "tu"
            - "th"
            - "ti"
            - "fix"

          # Nunca permite execução do masking em PRD.
          protected_envs:
            - "prd"

          scripts:
            - name: "valemobi_scramble"
              file: "masking/fc_valemobi_scramble_database.sql"
              function: "public.fc_valemobi_scramble_database"
              execute_function: true

        materialized_views:
          # Nenhum refresh de MV foi informado no procedimento manual.
          refresh_enabled: true
          refresh_all: true
          retry_enabled: true
          retry_attempts: 4
          retry_delay_seconds: 30
          items: []

        maintenance:
          enabled: true
          # Modos previstos:
          # none | analyze | vacuum_analyze
          mode: "analyze"

        connection_control:
          enabled: true
          block_new_connections: true
          terminate_sessions: true
          keep_old_blocked: true

        validations:
          enabled: true
          queries:
            - "queries/total.sql"
            - "queries/total-by-table.sql"

        hosts_env_sync:
          tu:
            - name: "AG-AD-CL-BD-007"
              ansible_host: "10.222.84.6"
              database_name: "valemobi"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true

          ti:
            - name: "AG-AD-CL-BD-011"
              ansible_host: "10.222.84.23"
              database_name: "valemobi"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true

          fix:
            - name: "AG-AH-CL-BD-002"
              ansible_host: "10.222.80.101"
              database_name: "valemobi"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true
