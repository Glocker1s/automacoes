---
# Use:
#   pgm_database_key: dbcvm_lab

cm:
  postgres_manager:
    databases:
      dbcvm_lab:
        description: "Lab DBCVM PostgreSQL Manager"
        database_name: "dbcvm"

        default_source_env: "prd"
        default_sync_targets:
          - "tu"
          - "th"
          - "fix"
        default_restore_targets: []

        backup:
          root_dir: "/backup/postgres_manager"
          jobs: 4
          format: "directory"
          extra_args: ""
          validate_dump: true

        restore:
          mode: "promote"
          target_temp_suffix: "_restoring"
          old_suffix: "_old"
          no_owner: true
          no_privileges: true
          jobs: 4
          extra_args: ""

          # Legado.
          # A manutenção agora será controlada pelo bloco maintenance.
          vacuum_analyze: false

          exclude_toc_patterns:
            - "USER MAPPING"
            - "MATERIALIZED VIEW DATA public mv_search_companys"
            - "MATERIALIZED VIEW DATA public mv_company_balance_guide"
            - "MATERIALIZED VIEW DATA public mv_masking_demo"

        database_create:
          inherit_from_current: true
          validate_inheritance: true

        grants:
          capture_before_restore: true
          apply_after_restore: true
          fail_on_apply_error: false

        # -------------------------------------------------------------------
        # PRESERVE DATA
        #
        # Simula as tabelas de configuração que precisam continuar com os
        # valores do ambiente destino.
        #
        # Exemplo PRD -> TU:
        #   app.environment_config de PRD vem no dump principal
        #   depois é substituída pela app.environment_config da TU atual
        # -------------------------------------------------------------------
        preserve_data:
          enabled: true
          fail_on_error: true
          run_on_envs:
            - "tu"
            - "th"
            - "fix"

          groups:
            - name: "environment_configuration"

              # São as tabelas das quais guardaremos os dados atuais do destino.
              backup_tables:
                - "app.environment_config"
                - "app.feature_flags"

              # São as tabelas que serão esvaziadas na _restoring antes de
              # colocar os dados preservados.
              #
              # audit.preserve_trigger_audit NÃO está no backup_tables.
              # Isso simula o caso CorePaqueta onde existe uma tabela truncada
              # que não é restaurada.
              truncate_tables:
                - "app.environment_config"
                - "app.feature_flags"
                - "audit.preserve_trigger_audit"

              restore_data_only: true

              # Simula o comportamento usado pela CorePaqueta.
              disable_triggers: true

              cascade: false
              jobs: 4

        # -------------------------------------------------------------------
        # POST RESTORE
        #
        # Essa tabela NÃO será preservada.
        # Os dados que vieram de PRD simplesmente serão removidos.
        # -------------------------------------------------------------------
        post_restore:
          truncate_enabled: true
          fail_on_error: true
          run_on_envs:
            - "tu"
            - "th"
            - "fix"

          truncate_groups:
            - name: "clear_runtime_sessions"
              tables:
                - "app.runtime_sessions"
              cascade: false

        # -------------------------------------------------------------------
        # DBLINK
        # -------------------------------------------------------------------
        dblink:
          enabled: true

          # Foreign Servers existentes no banco.
          # Os valores podem mudar de acordo com o ambiente destino.
          servers:
            - name: "remote_valemobi"
              environments:
                prd:
                  host: "127.0.0.1"
                  port: "5432"
                  dbname: "valemobi"
                tu:
                  host: "127.0.0.1"
                  port: "5432"
                  dbname: "valemobi"
                th:
                  host: "127.0.0.1"
                  port: "5432"
                  dbname: "valemobi"
                fix:
                  host: "127.0.0.1"
                  port: "5432"
                  dbname: "valemobi"

            - name: "remote_core_lab"
              environments:
                prd:
                  host: "10.10.10.10"
                  port: "5432"
                  dbname: "core_prd"
                tu:
                  host: "10.20.20.20"
                  port: "5433"
                  dbname: "core_tu"
                th:
                  host: "10.30.30.30"
                  port: "5434"
                  dbname: "core_th"
                fix:
                  host: "10.40.40.40"
                  port: "5435"
                  dbname: "core_fix"

          # User Mappings.
          # user_var/password_var continuam vindo da Credential do AAP.
          user_mappings:
            - server_name: "remote_valemobi"
              local_user: "postgres"
              user_var: "dblink_user"
              password_var: "dblink_password"

            - server_name: "remote_core_lab"
              local_user: "postgres"
              user_var: "dblink_user"
              password_var: "dblink_password"

          # Conexões nomeadas necessárias somente para SQLs que usam
          # dblink('nome_da_conexao', ...).
          connections:
            - name: "myconn"
              server_name: "remote_valemobi"
              connect_before_refresh: true

        # -------------------------------------------------------------------
        # MASKING
        #
        # Executará depois de preserve_data, post_restore e dblink.
        # -------------------------------------------------------------------
        masking:
          enabled: true
          fail_on_error: true
          run_on_envs:
            - "tu"
            - "th"
            - "fix"
          protected_envs:
            - "prd"
          scripts:
            - name: "dbcvm_lab_scramble"
              file: "masking/fc_dbcvm_lab_scramble_database.sql"
              function: "public.fc_dbcvm_lab_scramble_database"
              execute_function: true

        # -------------------------------------------------------------------
        # MATERIALIZED VIEWS
        #
        # mv_masking_demo prova que o refresh aconteceu depois do masking.
        # -------------------------------------------------------------------
        materialized_views:
          refresh_enabled: true
          refresh_all: false
          items:
            - schema: "public"
              name: "mv_search_companys"
              concurrently: false

            - schema: "public"
              name: "mv_company_balance_guide"
              concurrently: false

            - schema: "public"
              name: "mv_masking_demo"
              concurrently: false

        # -------------------------------------------------------------------
        # MANUTENÇÃO
        #
        # O procedimento do cliente usa ANALYZE.
        # -------------------------------------------------------------------
        maintenance:
          enabled: true
          mode: "analyze"

        connection_control:
          enabled: true
          block_new_connections: true
          terminate_sessions: true
          keep_old_blocked: true

        validations:
          enabled: true
          queries:
            - "queries/total.sql"
            - "queries/total-by-table.sql"
            - "queries/advanced-restore.sql"

        hosts_env_sync:
          prd:
            - name: "prd-dbcvm-01"
              ansible_host: "192.168.122.165"
              database_name: "dbcvm"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true

          tu:
            - name: "tu-dbcvm-01"
              ansible_host: "192.168.122.34"
              database_name: "dbcvm"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true

          th:
            - name: "th-dbcvm-01"
              ansible_host: "192.168.122.70"
              database_name: "dbcvm"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true

          fix:
            - name: "fix-dbcvm-01"
              ansible_host: "192.168.122.33"
              database_name: "dbcvm"
              port: 5432
              db_host: "127.0.0.1"
              source: true
              enabled: true