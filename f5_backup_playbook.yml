---
- name: F5 - Backup UCS
  hosts: all
  gather_facts: false

  tasks:
    - name: Executar F5 Backup Manager
      block:
        - name: Marcar fluxo como iniciado sem falha
          ansible.builtin.set_fact:
            _f5_backup_flow_failed: false
            _f5_backup_report_published: false

        - name: Executar role F5 Backup Manager
          ansible.builtin.include_role:
            name: f5_backup_manager
          run_once: true

      rescue:
        - name: Marcar fluxo como falhado
          ansible.builtin.set_fact:
            _f5_backup_flow_failed: true

        - name: Publicar relatório mínimo para falha inesperada
          ansible.builtin.set_stats:
            data:
              send_mail_subject: >-
                Ansible-Report (FALHA) - {{ awx_job_template_name | default('F5 Backup Manager') }}
                - Job #{{ awx_job_id | default('local') }}
              send_mail_body: |
                <html>
                  <body style="font-family:Arial,sans-serif;color:#111111;">
                    <h2>F5 - Backup UCS</h2>
                    <p><b>Status:</b> FALHA</p>
                    <p><b>Task:</b> {{ ansible_failed_task.name | default('—') }}</p>
                    <p><b>Detalhe:</b> {{ ansible_failed_result.msg | default(ansible_failed_result | string) }}</p>
                  </body>
                </html>
          when: not (_f5_backup_report_published | default(false) | bool)

        - name: Finalizar job como falha
          ansible.builtin.fail:
            msg: >-
              F5 Backup Manager finalizado com falha.
              {{ ansible_failed_result.msg | default('Consulte o relatório da execução.') }}

      always:
        # Segurança adicional caso ocorra erro inesperado antes do cleanup da role.
        - name: CIFS | Desmontar no always quando foi montado pelo job
          ansible.builtin.command:
            argv: [umount, "{{ f5_backup_cifs_mount_path }}"]
          delegate_to: "{{ f5_backup_cifs_delegate_host | default(inventory_hostname) }}"
          become: true
          changed_when: false
          failed_when: false
          when:
            - f5_backup_cifs_mounted_by_job | default(false) | bool
            - f5_backup_cifs_mount_path is defined
          run_once: true

        - name: CIFS | Verificar montagem residual no always
          ansible.builtin.command:
            argv: [mountpoint, -q, "{{ f5_backup_cifs_mount_path }}"]
          delegate_to: "{{ f5_backup_cifs_delegate_host | default(inventory_hostname) }}"
          become: true
          register: _f5_cifs_always_mount_check
          failed_when: false
          changed_when: false
          when: f5_backup_cifs_mount_path is defined
          run_once: true

        - name: CIFS | Remover ponto de montagem vazio no always
          ansible.builtin.command:
            argv: [rmdir, "{{ f5_backup_cifs_mount_path }}"]
          delegate_to: "{{ f5_backup_cifs_delegate_host | default(inventory_hostname) }}"
          become: true
          failed_when: false
          changed_when: false
          when:
            - _f5_cifs_always_mount_check is defined
            - not (_f5_cifs_always_mount_check.skipped | default(false) | bool)
            - (_f5_cifs_always_mount_check.rc | default(0) | int) != 0
          run_once: true

        - name: CIFS | Remover credencial no always
          ansible.builtin.file:
            path: "{{ f5_backup_cifs_credentials_file }}"
            state: absent
          delegate_to: "{{ f5_backup_cifs_delegate_host | default(inventory_hostname) }}"
          become: true
          changed_when: false
          failed_when: false
          no_log: true
          when: f5_backup_cifs_credentials_file is defined
          run_once: true

        - name: Remover staging temporário no host Linux
          ansible.builtin.file:
            path: "{{ f5_backup_remote_temp_dir | default('/tmp/f5-backup-stage-' ~ (awx_job_id | default('local') | string)) }}"
            state: absent
          delegate_to: "{{ f5_backup_cifs_delegate_host | default(inventory_hostname) }}"
          become: false
          changed_when: false
          failed_when: false
          run_once: true

        - name: Remover diretório temporário local de UCS
          ansible.builtin.file:
            path: "{{ f5_backup_local_temp_dir | default('/tmp/f5-backup-' ~ (awx_job_id | default('local') | string)) }}"
            state: absent
          delegate_to: localhost
          changed_when: false
          failed_when: false
          run_once: true
