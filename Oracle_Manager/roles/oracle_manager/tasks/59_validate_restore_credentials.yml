---
- name: Restore credentials | Resolver schemas sem senha configurada
  ansible.builtin.set_fact:
    _orm_missing_passwords_json: >-
      {%- set out = [] -%}
      {%- for schema in orm_schemas -%}
        {%- set cfg = (orm_profile_cfg.users | default({})).get(schema, (orm_profile_cfg.users | default({})).get(schema | upper, {})) -%}
        {%- set pvar = cfg.password_var | default('') | string | trim -%}
        {%- set pval = lookup('ansible.builtin.vars', pvar, default='') if pvar | length > 0 else '' -%}
        {%- if pvar | length == 0 or pval | string | length == 0 -%}
          {%- set _ = out.append({'schema': schema, 'password_var': pvar}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}
  no_log: true
  when: orm_restore_unlock_users | bool

- name: Restore credentials | Publicar schemas sem senha
  ansible.builtin.set_fact:
    orm_restore_missing_passwords: "{{ _orm_missing_passwords_json | default('[]') | from_json }}"
  when: orm_restore_unlock_users | bool

- name: Restore credentials | Validar senhas antes da fase destrutiva
  ansible.builtin.assert:
    that:
      - orm_restore_missing_passwords | default([]) | length == 0
    fail_msg: >-
      Senha de destino não disponível para: {{ orm_restore_missing_passwords | default([]) | map(attribute='schema') | join(', ') }}.
      Configure users.<SCHEMA>.password_var no profile e injete a variável pela Credential do AAP.
  when:
    - orm_restore_unlock_users | bool
    - orm_restore_require_password | bool

- name: Restore credentials | Registrar aviso quando senha não é obrigatória
  ansible.builtin.set_fact:
    orm_host_warning: true
    orm_restore_password_warning: >-
      Schema(s) sem senha de destino configurada: {{ orm_restore_missing_passwords | map(attribute='schema') | join(', ') }}.
      O usuário será apenas desbloqueado após o import, mantendo a senha presente no dump.
  when:
    - orm_restore_unlock_users | bool
    - not (orm_restore_require_password | bool)
    - orm_restore_missing_passwords | default([]) | length > 0
