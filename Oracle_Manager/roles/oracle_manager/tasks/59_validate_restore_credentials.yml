---
- name: Restore credentials | Carregar configuração de senha
  ansible.builtin.set_fact:
    _orm_password_cfg: "{{ orm_profile_cfg.restore.password | default({}) }}"

- name: Restore credentials | Resolver configuração de senha
  ansible.builtin.set_fact:
    orm_restore_password_default_var_effective: "{{ _orm_password_cfg.default_var | default(orm_restore_password_default_var) }}"
    orm_restore_password_env_vars_effective: "{{ _orm_password_cfg.env_vars | default(orm_restore_password_env_vars) }}"
    orm_restore_password_min_length_effective: "{{ _orm_password_cfg.min_length | default(orm_restore_password_min_length) | int }}"
    orm_restore_password_require_upper_effective: "{{ _orm_password_cfg.require_upper | default(orm_restore_password_require_upper) | bool }}"
    orm_restore_password_require_lower_effective: "{{ _orm_password_cfg.require_lower | default(orm_restore_password_require_lower) | bool }}"
    orm_restore_password_require_digit_effective: "{{ _orm_password_cfg.require_digit | default(orm_restore_password_require_digit) | bool }}"
    orm_restore_password_allow_multi_schema_effective: "{{ _orm_password_cfg.allow_multi_schema | default(orm_restore_password_allow_multi_schema) | bool }}"

- name: Restore credentials | Resolver variável de senha do destino
  ansible.builtin.set_fact:
    orm_restore_password_var_name: >-
      {{
        orm_restore_password_env_vars_effective.get(
          orm_env | lower | trim,
          orm_restore_password_default_var_effective
        )
      }}

- name: Restore credentials | Carregar senha informada
  ansible.builtin.set_fact:
    orm_restore_password_effective: "{{ vars.get(orm_restore_password_var_name, '') | string }}"
  no_log: true

- name: Restore credentials | Validar uso de senha com múltiplos schemas
  ansible.builtin.assert:
    that:
      - (orm_schemas | length == 1) or (orm_restore_password_allow_multi_schema_effective | bool)
    fail_msg: >-
      Foram selecionados múltiplos schemas ({{ orm_schemas | join(', ') }}), mas
      restore.password.allow_multi_schema=false. Execute os schemas separadamente
      ou habilite explicitamente restore.password.allow_multi_schema.
  when: orm_restore_require_password | bool

- name: Restore credentials | Validar senha obrigatória
  ansible.builtin.assert:
    that:
      - orm_restore_password_effective | length > 0
    fail_msg: >-
      Senha do schema não informada para o ambiente {{ orm_env | upper }}.
      A variável esperada nesta execução é '{{ orm_restore_password_var_name }}'.
  when: orm_restore_require_password | bool

- name: Restore credentials | Avaliar política da senha
  ansible.builtin.set_fact:
    _orm_password_length_ok: >-
      {{
        (orm_restore_password_effective | length)
        >= (orm_restore_password_min_length_effective | int)
      }}
    _orm_password_upper_ok: >-
      {{
        (not (orm_restore_password_require_upper_effective | bool))
        or ((orm_restore_password_effective | regex_findall('[A-Z]') | length) > 0)
      }}
    _orm_password_lower_ok: >-
      {{
        (not (orm_restore_password_require_lower_effective | bool))
        or ((orm_restore_password_effective | regex_findall('[a-z]') | length) > 0)
      }}
    _orm_password_digit_ok: >-
      {{
        (not (orm_restore_password_require_digit_effective | bool))
        or ((orm_restore_password_effective | regex_findall('[0-9]') | length) > 0)
      }}
  no_log: true
  when: orm_restore_password_effective | length > 0

- name: Restore credentials | Validar política da senha
  ansible.builtin.assert:
    that:
      - _orm_password_length_ok | bool
      - _orm_password_upper_ok | bool
      - _orm_password_lower_ok | bool
      - _orm_password_digit_ok | bool
    fail_msg: >-
      A senha informada para o ambiente {{ orm_env | upper }} não atende à política definida.
      Requisitos: mínimo de {{ orm_restore_password_min_length_effective }} caracteres;
      maiúscula={{ orm_restore_password_require_upper_effective }};
      minúscula={{ orm_restore_password_require_lower_effective }};
      número={{ orm_restore_password_require_digit_effective }}.
  when: orm_restore_password_effective | length > 0

- name: Restore credentials | Registrar aviso quando senha não é obrigatória
  ansible.builtin.set_fact:
    orm_host_warning: true
  when:
    - not (orm_restore_require_password | bool)
    - orm_restore_password_effective | length == 0
