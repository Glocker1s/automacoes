---
- name: Shared storage | Resolver configuração efetiva
  ansible.builtin.set_fact:
    _orm_storage_protocol: "{{ orm_dump_storage_protocol_effective | default(orm_dump_storage_protocol_normalized | default(orm_dump_storage_protocol | default('cifs'))) | string | lower | trim }}"
    _orm_storage_label: >-
      {{
        orm_nfs_label
        if (orm_dump_storage_protocol_effective | default(orm_dump_storage_protocol_normalized | default(orm_dump_storage_protocol | default('cifs'))) | string | lower | trim) == 'nfs'
        else orm_cifs_label
      }}
    _orm_storage_server: >-
      {{
        (orm_nfs_addresses | default({})).get(orm_nfs_label | default('') | lower, '')
        if (orm_dump_storage_protocol_effective | default(orm_dump_storage_protocol_normalized | default(orm_dump_storage_protocol | default('cifs'))) | string | lower | trim) == 'nfs'
        else (orm_cifs_addresses | default({})).get(orm_cifs_label | default('') | lower, '')
      }}
    _orm_storage_enabled: >-
      {{
        (orm_nfs_enabled | default(true) | bool)
        if (orm_dump_storage_protocol_effective | default(orm_dump_storage_protocol_normalized | default(orm_dump_storage_protocol | default('cifs'))) | string | lower | trim) == 'nfs'
        else (orm_cifs_enabled | default(true) | bool)
      }}
    orm_dump_storage_data_dir_effective: >-
      {{
        orm_dump_storage_mount_dir
        ~ (orm_dump_storage_path | regex_replace('/$', ''))
      }}

- name: Shared storage | Validar configuração
  ansible.builtin.assert:
    that:
      - _orm_storage_protocol in ['cifs', 'nfs']
      - _orm_storage_enabled | bool
      - _orm_storage_server | length > 0
    fail_msg: >-
      Storage {{ _orm_storage_protocol | upper }} solicitado, porém está desabilitado
      ou o label {{ _orm_storage_label }} não possui endereço configurado.

- name: Shared storage | Criar diretório de montagem
  ansible.builtin.file:
    path: "{{ orm_dump_storage_mount_dir }}"
    state: directory
    mode: "0755"
  become: true
  become_user: root

- name: Shared storage | Criar arquivo temporário de senha CIFS
  ansible.builtin.copy:
    dest: "{{ orm_cifs_password_file }}"
    content: "{{ ansible_password | default('') }}"
    mode: "0600"
  become: true
  become_user: root
  no_log: true
  when: _orm_storage_protocol == 'cifs'

- name: Shared storage | Desmontar montagem anterior
  ansible.builtin.shell: |
    if mountpoint -q "{{ orm_dump_storage_mount_dir }}"; then
      umount "{{ orm_dump_storage_mount_dir }}" || true
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: root
  changed_when: false

- name: Shared storage | Montar CIFS
  ansible.builtin.shell: |
    set -euo pipefail

    ORACLE_UID="$(id -u "{{ orm_os_user_effective }}")"
    ORACLE_GID="$(id -g "{{ orm_os_user_effective }}")"

    mount -t cifs "{{ _orm_storage_server }}" "{{ orm_dump_storage_mount_dir }}" \
      -o username="{{ ansible_user }}",password="$(cat {{ orm_cifs_password_file }})",domain="{{ orm_cifs_domain }}",rw,vers="{{ orm_cifs_vers }}",uid="${ORACLE_UID}",gid="${ORACLE_GID}"
  args:
    executable: /bin/bash
  become: true
  become_user: root
  no_log: true
  when: _orm_storage_protocol == 'cifs'

- name: Shared storage | Montar NFS
  ansible.builtin.command:
    argv:
      - mount
      - -t
      - nfs
      - -o
      - "{{ orm_nfs_mount_options | default('rw') }}"
      - "{{ _orm_storage_server }}"
      - "{{ orm_dump_storage_mount_dir }}"
  become: true
  become_user: root
  when: _orm_storage_protocol == 'nfs'

- name: Shared storage | Criar diretório de dados
  ansible.builtin.file:
    path: "{{ orm_dump_storage_data_dir_effective }}"
    state: directory
    mode: "0775"
  become: true
  become_user: "{{ orm_os_user_effective }}"

- name: Shared storage | Validar acesso do Oracle ao diretório de dados
  ansible.builtin.shell: |
    set -euo pipefail

    TEST_FILE="{{ orm_dump_storage_data_dir_effective }}/.oracle_manager_test_{{ tower_job_id | default(awx_job_id | default('local')) }}"

    touch "$TEST_FILE"
    rm -f "$TEST_FILE"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ orm_os_user_effective }}"
  changed_when: false

- name: Shared storage | Registrar montagem ativa
  ansible.builtin.set_fact:
    orm_shared_storage_mounted: true
    orm_shared_storage_protocol_mounted: "{{ _orm_storage_protocol }}"
