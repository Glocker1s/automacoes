---
- name: Shared cleanup | Inicializar estado
  ansible.builtin.set_fact:
    orm_storage_cleanup_failed: false
    orm_storage_cleanup_error: ""
    orm_storage_cleanup_dump_removed: false
    orm_storage_cleanup_latest_removed: false
    orm_storage_cleanup_performed: false
    _orm_cleanup_action: "{{ orm_action_normalized | default(orm_action | default('backup') | lower) }}"
    _orm_cleanup_enabled: "{{ orm_cleanup_shared_dump_after_restore | default(false) | bool }}"
    _orm_cleanup_storage_protocol: "{{ orm_dump_storage_protocol_normalized | default(orm_dump_storage_protocol | default('cifs')) | string | lower | trim }}"

- name: Shared cleanup | Resolver hosts obrigatórios
  ansible.builtin.set_fact:
    _orm_cleanup_required_hosts: >-
      {{
        (
          (groups.orm_source_targets | default([]))
          +
          (groups.orm_restore_targets | default([]))
        )
        | unique
        | list
        if _orm_cleanup_action == 'sync'
        else
        (groups.orm_restore_targets | default([]))
      }}
    _orm_cleanup_restore_hosts: "{{ groups.orm_restore_targets | default([]) }}"
    _orm_cleanup_delegate_host: "{{ ((groups.orm_restore_targets | default([])) | first) | default('') }}"
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']

- name: Shared cleanup | Resolver configuração do storage
  ansible.builtin.set_fact:
    _orm_cleanup_storage_label: >-
      {{ orm_nfs_label if _orm_cleanup_storage_protocol == 'nfs' else orm_cifs_label }}
    _orm_cleanup_storage_server: >-
      {{
        (orm_nfs_addresses | default({})).get(orm_nfs_label | default('') | lower, '')
        if _orm_cleanup_storage_protocol == 'nfs'
        else (orm_cifs_addresses | default({})).get(orm_cifs_label | default('') | lower, '')
      }}
    _orm_cleanup_storage_enabled: >-
      {{
        (orm_nfs_enabled | default(true) | bool)
        if _orm_cleanup_storage_protocol == 'nfs'
        else (orm_cifs_enabled | default(true) | bool)
      }}
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']

- name: Shared cleanup | Inicializar validação de hosts e dump sets
  ansible.builtin.set_fact:
    _orm_cleanup_not_success_hosts: []
    _orm_cleanup_dump_set_signatures: []
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']

- name: Shared cleanup | Identificar hosts sem sucesso
  ansible.builtin.set_fact:
    _orm_cleanup_not_success_hosts: "{{ _orm_cleanup_not_success_hosts + [item] }}"
  loop: "{{ _orm_cleanup_required_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']
    - hostvars[item].orm_host_status | default('NÃO EXECUTADO') != 'SUCESSO'

- name: Shared cleanup | Resolver dump set utilizado pelos destinos
  ansible.builtin.set_fact:
    _orm_cleanup_dump_set_signatures: >-
      {{
        _orm_cleanup_dump_set_signatures
        +
        [
          (
            hostvars[item].orm_effective_dump_names
            | default(
                [hostvars[item].orm_effective_dump_name]
                if hostvars[item].orm_effective_dump_name | default('') | length > 0
                else []
              )
            | sort
            | join('|')
          )
        ]
      }}
  loop: "{{ _orm_cleanup_restore_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']
    - >-
      (
        hostvars[item].orm_effective_dump_names | default([]) | length > 0
      )
      or
      (
        hostvars[item].orm_effective_dump_name | default('') | length > 0
      )

- name: Shared cleanup | Publicar dump sets únicos
  ansible.builtin.set_fact:
    _orm_cleanup_dump_set_signatures_unique: >-
      {{ _orm_cleanup_dump_set_signatures | reject('equalto', '') | unique | list }}
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']

- name: Shared cleanup | Informar cleanup não executado por falha operacional
  ansible.builtin.debug:
    msg: >-
      Cleanup do dump no storage {{ _orm_cleanup_storage_protocol | upper }} não executado
      porque nem todos os hosts terminaram com SUCESSO:
      {{ _orm_cleanup_not_success_hosts | join(', ') }}.
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']
    - _orm_cleanup_not_success_hosts | default([]) | length > 0

- name: Shared cleanup | Registrar inconsistência no dump set resolvido
  ansible.builtin.set_fact:
    orm_storage_cleanup_failed: true
    orm_storage_cleanup_error: >-
      Cleanup do storage compartilhado não executado.
      Era esperado exatamente um dump set comum aos destinos,
      mas foram resolvidos:
      {{ _orm_cleanup_dump_set_signatures_unique | default([]) | join(' ; ') }}.
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']
    - _orm_cleanup_not_success_hosts | default([]) | length == 0
    - _orm_cleanup_dump_set_signatures_unique | default([]) | length != 1

- name: Shared cleanup | Remover dump set consumido
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']
    - _orm_cleanup_not_success_hosts | default([]) | length == 0
    - _orm_cleanup_dump_set_signatures_unique | default([]) | length == 1
    - _orm_cleanup_delegate_host | default('') | length > 0
  block:

    - name: Shared cleanup | Resolver parâmetros
      ansible.builtin.set_fact:
        _orm_cleanup_dump_names: "{{ (_orm_cleanup_dump_set_signatures_unique | first).split('|') }}"
        _orm_cleanup_oracle_user: >-
          {{ hostvars[_orm_cleanup_delegate_host].orm_os_user_effective | default(hostvars[_orm_cleanup_delegate_host].orm_os_user | default(orm_default_os_user)) }}

    - name: Shared cleanup | Validar configuração do storage
      ansible.builtin.assert:
        that:
          - _orm_cleanup_storage_protocol in ['cifs', 'nfs']
          - _orm_cleanup_storage_enabled | bool
          - _orm_cleanup_storage_server | length > 0
          - _orm_cleanup_dump_names | length > 0
        fail_msg: >-
          Storage {{ _orm_cleanup_storage_protocol | upper }} ou dump set não configurado para cleanup.
          Label={{ _orm_cleanup_storage_label }}.

    - name: Shared cleanup | Criar diretório de montagem
      ansible.builtin.file:
        path: "{{ orm_dump_storage_mount_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root

    - name: Shared cleanup | Criar arquivo temporário de senha CIFS
      ansible.builtin.copy:
        dest: "{{ orm_cifs_password_file }}"
        content: "{{ hostvars[_orm_cleanup_delegate_host].ansible_password | default(ansible_password | default('')) }}"
        mode: "0600"
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root
      no_log: true
      when: _orm_cleanup_storage_protocol == 'cifs'

    - name: Shared cleanup | Desmontar montagem anterior
      ansible.builtin.shell: |
        if mountpoint -q "{{ orm_dump_storage_mount_dir }}"; then
          umount "{{ orm_dump_storage_mount_dir }}" || true
        fi
      args:
        executable: /bin/bash
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root
      changed_when: false

    - name: Shared cleanup | Montar CIFS
      ansible.builtin.shell: |
        set -euo pipefail

        ORACLE_UID="$(id -u "{{ _orm_cleanup_oracle_user }}")"
        ORACLE_GID="$(id -g "{{ _orm_cleanup_oracle_user }}")"

        mount -t cifs "{{ _orm_cleanup_storage_server }}" "{{ orm_dump_storage_mount_dir }}" \
          -o username="{{ hostvars[_orm_cleanup_delegate_host].ansible_user | default(ansible_user | default('')) }}",password="$(cat {{ orm_cifs_password_file }})",domain="{{ orm_cifs_domain }}",rw,vers="{{ orm_cifs_vers }}",uid="${ORACLE_UID}",gid="${ORACLE_GID}"
      args:
        executable: /bin/bash
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root
      no_log: true
      when: _orm_cleanup_storage_protocol == 'cifs'

    - name: Shared cleanup | Montar NFS
      ansible.builtin.command:
        argv:
          - mount
          - -t
          - nfs
          - -o
          - "{{ orm_nfs_mount_options | default('rw') }}"
          - "{{ _orm_cleanup_storage_server }}"
          - "{{ orm_dump_storage_mount_dir }}"
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root
      when: _orm_cleanup_storage_protocol == 'nfs'

    - name: Shared cleanup | Remover dump set e latest relacionado
      ansible.builtin.shell: |
        set -euo pipefail

        STORAGE_DIR="{{ orm_dump_storage_mount_dir }}{{ orm_dump_storage_path | regex_replace('/$', '') }}"
        MANIFEST="$STORAGE_DIR/{{ orm_latest_manifest_name }}"

        if [ ! -d "$STORAGE_DIR" ]; then
          echo "Diretório do storage não encontrado: $STORAGE_DIR" >&2
          exit 20
        fi

        removed=0
        while IFS= read -r DUMP_NAME; do
          [ -n "$DUMP_NAME" ] || continue

          case "$DUMP_NAME" in
            */*)
              echo "Nome de dump inválido para cleanup: $DUMP_NAME" >&2
              exit 21
              ;;
          esac

          if [ -f "$STORAGE_DIR/$DUMP_NAME" ]; then
            rm -f -- "$STORAGE_DIR/$DUMP_NAME"
            echo "__DUMP_REMOVED__=$DUMP_NAME"
            removed=1
          else
            echo "__DUMP_ALREADY_ABSENT__=$DUMP_NAME"
          fi
        done <<< "$ORM_CLEANUP_DUMP_NAMES"

        if [ -f "$MANIFEST" ]; then
          CURRENT_SET="$(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' "$MANIFEST" | sort | paste -sd'|' -)"
          EXPECTED_SET="$(printf '%s\n' "$ORM_CLEANUP_DUMP_NAMES" | sed -e '/^[[:space:]]*$/d' | sort | paste -sd'|' -)"

          if [ "$CURRENT_SET" = "$EXPECTED_SET" ]; then
            rm -f -- "$MANIFEST"
            echo "__LATEST_REMOVED__=true"
          else
            echo "__LATEST_KEPT__=$CURRENT_SET"
          fi
        fi

        sync
        echo "__DUMP_SET_REMOVED__=$removed"
      args:
        executable: /bin/bash
      environment:
        ORM_CLEANUP_DUMP_NAMES: "{{ _orm_cleanup_dump_names | join('\n') }}"
      register: _orm_cleanup_exec
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: "{{ _orm_cleanup_oracle_user }}"
      changed_when: "'__DUMP_REMOVED__=' in (_orm_cleanup_exec.stdout | default('')) or '__LATEST_REMOVED__=true' in (_orm_cleanup_exec.stdout | default(''))"

    - name: Shared cleanup | Publicar resultado
      ansible.builtin.set_fact:
        orm_storage_cleanup_performed: true
        orm_storage_cleanup_dump_removed: "{{ '__DUMP_REMOVED__=' in (_orm_cleanup_exec.stdout | default('')) }}"
        orm_storage_cleanup_latest_removed: "{{ '__LATEST_REMOVED__=true' in (_orm_cleanup_exec.stdout | default('')) }}"

  rescue:

    - name: Shared cleanup | Registrar falha
      ansible.builtin.set_fact:
        orm_storage_cleanup_failed: true
        orm_storage_cleanup_error: >-
          {{
            ansible_failed_result.msg
            | default(
                ansible_failed_result.stderr
                | default('Falha ao remover dump set consumido do storage compartilhado.')
              )
          }}

  always:

    - name: Shared cleanup | Desmontar storage
      ansible.builtin.shell: "umount {{ orm_dump_storage_mount_dir }} || true"
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root
      changed_when: false
      failed_when: false

    - name: Shared cleanup | Remover senha temporária CIFS
      ansible.builtin.file:
        path: "{{ orm_cifs_password_file }}"
        state: absent
      delegate_to: "{{ _orm_cleanup_delegate_host }}"
      become: true
      become_user: root
      failed_when: false
      no_log: true
      when: _orm_cleanup_storage_protocol == 'cifs'


- name: Shared cleanup | Exibir resultado
  ansible.builtin.debug:
    msg:
      action: "{{ _orm_cleanup_action }}"
      protocol: "{{ _orm_cleanup_storage_protocol }}"
      performed: "{{ orm_storage_cleanup_performed }}"
      dump_removed: "{{ orm_storage_cleanup_dump_removed }}"
      latest_removed: "{{ orm_storage_cleanup_latest_removed }}"
      failed: "{{ orm_storage_cleanup_failed }}"
      error: "{{ orm_storage_cleanup_error }}"
  when:
    - _orm_cleanup_enabled | bool
    - _orm_cleanup_action in ['restore', 'sync']
