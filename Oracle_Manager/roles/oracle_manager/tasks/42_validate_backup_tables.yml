---
- name: Backup tables | Consultar tabelas na origem
  ansible.builtin.shell:
    cmd: |
      PDB="{{ orm_pdb_effective | default('') }}"

      if [ -n "$PDB" ]; then
        export ORACLE_PDB_SID="$PDB"
      else
        unset ORACLE_PDB_SID
      fi

      unset TWO_TASK
      unset LOCAL

      "{{ orm_oracle_home_effective }}/bin/sqlplus" -s "/ as sysdba" <<SQL
      whenever sqlerror exit sql.sqlcode
      set heading off feedback off pages 0 verify off echo off

      select case
               when count(*) = 1 then 'FOUND'
               else 'MISSING'
             end
        from dba_tables
       where upper(owner) = upper('{{ item.split(".")[0] }}')
         and upper(table_name) = upper('{{ item.split(".")[1] }}');

      exit
      SQL
    executable: /bin/bash
  environment:
    ORACLE_SID: "{{ orm_sid_effective }}"
    ORACLE_HOME: "{{ orm_oracle_home_effective }}"
    PATH: "{{ orm_oracle_home_effective }}/bin:/usr/local/bin:/usr/bin:/bin"
  loop: "{{ orm_tables_effective }}"
  loop_control:
    label: "{{ item }}"
  register: _orm_backup_tables_check
  changed_when: false
  become: true
  become_user: "{{ orm_os_user_effective }}"

- name: Backup tables | Inicializar tabelas encontradas e ausentes
  ansible.builtin.set_fact:
    orm_backup_tables_found: []
    orm_backup_tables_missing: []

- name: Backup tables | Publicar tabelas encontradas
  ansible.builtin.set_fact:
    orm_backup_tables_found: "{{ orm_backup_tables_found + [item.item] }}"
  loop: "{{ _orm_backup_tables_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - "'FOUND' in (item.stdout_lines | default([]) | map('trim') | list)"

- name: Backup tables | Publicar tabelas ausentes
  ansible.builtin.set_fact:
    orm_backup_tables_missing: "{{ orm_backup_tables_missing + [item.item] }}"
  loop: "{{ _orm_backup_tables_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - "'FOUND' not in (item.stdout_lines | default([]) | map('trim') | list)"

- name: Backup tables | Validar tabelas solicitadas
  ansible.builtin.assert:
    that:
      - orm_backup_tables_missing | length == 0
    fail_msg: >-
      Tabela(s) não encontrada(s) no host {{ inventory_hostname }},
      SID={{ orm_sid_effective }},
      PDB={{ orm_pdb_effective | default('') }}:
      {{ orm_backup_tables_missing | join(', ') }}.