---
- name: Normalizar ação, profile e escopo
  ansible.builtin.set_fact:
    orm_action_normalized: "{{ orm_action | default('backup') | string | lower | trim }}"
    orm_profile_key_normalized: "{{ orm_profile_key | default('') | string | lower | trim }}"
    orm_scope_normalized: "{{ orm_scope | default('schema') | string | lower | trim }}"
    orm_table_exists_action_normalized: "{{ orm_table_exists_action | default('truncate') | string | lower | trim }}"
    orm_job_id: "{{ tower_job_id | default(awx_job_id | default('local')) }}"
    orm_job_template_name_effective: "{{ tower_job_template_name | default(awx_job_template_name | default('Oracle Manager')) }}"
    orm_run_timestamp: "{{ lookup('ansible.builtin.pipe', 'TZ=' ~ (orm_report_timezone | default('America/Sao_Paulo')) ~ ' date +%Y%m%d_%H%M%S') }}"

- name: Validar ação
  ansible.builtin.assert:
    that:
      - orm_action_normalized in ['backup', 'restore', 'sync']
    fail_msg: >-
      orm_action inválida: {{ orm_action }}.
      Valores aceitos: backup, restore, sync.

- name: Validar profile informado
  ansible.builtin.assert:
    that:
      - orm_profile_key_normalized | length > 0
    fail_msg: "Informe orm_profile_key, por exemplo: riskmanager."

- name: Validar escopo da operação
  ansible.builtin.assert:
    that:
      - orm_scope_normalized in ['schema', 'tables']
    fail_msg: >-
      orm_scope inválido: {{ orm_scope | default('') }}.
      Valores aceitos: schema, tables.

- name: Validar ação para tabela existente
  ansible.builtin.assert:
    that:
      - orm_table_exists_action_normalized in ['truncate', 'replace', 'skip']
    fail_msg: >-
      orm_table_exists_action inválido:
      {{ orm_table_exists_action | default('') }}.
      Valores aceitos: truncate, replace, skip.

- name: Normalizar target_envs bruto do survey
  ansible.builtin.set_fact:
    _orm_target_envs_json: >-
      {%- set raw = orm_target_envs | default([]) -%}
      {%- if raw is sequence and not (raw is string) -%}
        {{ raw | list | to_json }}
      {%- else -%}
        {%- set s = raw | string | trim -%}
        {%- if s | length == 0 -%}
          {{ [] | to_json }}
        {%- elif s.startswith('[') and s.endswith(']') -%}
          {{ (s | from_yaml) | list | to_json }}
        {%- else -%}
          {{ s.split(',') | list | to_json }}
        {%- endif -%}
      {%- endif -%}

- name: Normalizar target_hosts bruto do survey
  ansible.builtin.set_fact:
    _orm_target_hosts_json: >-
      {%- set raw = orm_target_hosts | default([]) -%}
      {%- if raw is sequence and not (raw is string) -%}
        {{ raw | list | to_json }}
      {%- else -%}
        {%- set s = raw | string | trim -%}
        {%- if s | length == 0 -%}
          {{ [] | to_json }}
        {%- elif s.startswith('[') and s.endswith(']') -%}
          {{ (s | from_yaml) | list | to_json }}
        {%- else -%}
          {{ s.split(',') | list | to_json }}
        {%- endif -%}
      {%- endif -%}

- name: Normalizar schemas bruto do survey
  ansible.builtin.set_fact:
    _orm_schemas_json: >-
      {%- set raw = orm_schemas | default([]) -%}
      {%- if raw is sequence and not (raw is string) -%}
        {{ raw | list | to_json }}
      {%- else -%}
        {%- set s = raw | string | trim -%}
        {%- if s | length == 0 -%}
          {{ [] | to_json }}
        {%- elif s.startswith('[') and s.endswith(']') -%}
          {{ (s | from_yaml) | list | to_json }}
        {%- else -%}
          {{ s.split(',') | list | to_json }}
        {%- endif -%}
      {%- endif -%}

- name: Normalizar tabelas bruto do survey
  ansible.builtin.set_fact:
    _orm_tables_json: >-
      {%- set raw = orm_tables | default([]) -%}
      {%- if raw is sequence and not (raw is string) -%}
        {{ raw | list | to_json }}
      {%- else -%}
        {%- set s = raw | string | trim -%}
        {%- if s | length == 0 -%}
          {{ [] | to_json }}
        {%- elif s.startswith('[') and s.endswith(']') -%}
          {{ (s | from_yaml) | list | to_json }}
        {%- else -%}
          {%- set normalized = s
              | replace('\r', ',')
              | replace('\n', ',')
              | replace(';', ',') -%}
          {{ normalized.split(',') | list | to_json }}
        {%- endif -%}
      {%- endif -%}

- name: Publicar entradas normalizadas
  ansible.builtin.set_fact:
    orm_selected_target_envs: >-
      {{
        _orm_target_envs_json
        | from_json
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | unique
        | list
      }}
    orm_selected_target_hosts: >-
      {{
        _orm_target_hosts_json
        | from_json
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | unique
        | list
      }}
    orm_selected_schemas: >-
      {{
        _orm_schemas_json
        | from_json
        | map('string')
        | map('trim')
        | map('upper')
        | reject('equalto', '')
        | unique
        | list
      }}
    orm_selected_tables: >-
      {{
        _orm_tables_json
        | from_json
        | map('string')
        | map('trim')
        | map('upper')
        | reject('equalto', '')
        | unique
        | list
      }}
    orm_source_env_normalized: "{{ orm_source_env | default('') | string | lower | trim }}"
    orm_source_host_normalized: "{{ orm_source_host | default('') | string | lower | trim }}"

- name: Validar tabelas informadas no Survey
  ansible.builtin.assert:
    that:
      - item is match('^[A-Z][A-Z0-9_$#]*\.[A-Z][A-Z0-9_$#]*$')
    fail_msg: >-
      Tabela inválida: '{{ item }}'.
      Informe no formato OWNER.TABELA,
      por exemplo CORRWIN.TMORORDE_COPL.
  loop: "{{ orm_selected_tables }}"
  loop_control:
    label: "{{ item }}"
  when: orm_scope_normalized == 'tables'

- name: Validar confirmação para restore/sync
  ansible.builtin.assert:
    that:
      - orm_confirm_restore | default('nao') | string | lower in ['sim', 's', 'yes', 'true', '1']
    fail_msg: >-
      A ação {{ orm_action_normalized }} altera objetos Oracle de destino.
      Informe orm_confirm_restore=sim para confirmar.
  when: orm_action_normalized in ['restore', 'sync']
