---
- name: Restore dump | Resolver dump via storage compartilhado com staging local
  when:
    - orm_restore_storage_mode == 'local'
    - orm_dump_storage_enabled_effective | bool
    - not (orm_host_failed | bool)
  block:

    - name: Restore dump | Montar storage compartilhado para staging
      ansible.builtin.import_tasks: 36_mount_storage.yml

    - name: Restore dump | Resolver nome efetivo no storage compartilhado
      ansible.builtin.shell: |
        set -euo pipefail

        STORAGE_DIR="{{ orm_dump_storage_data_dir_effective }}"
        REQUESTED="{{ orm_restore_dump_name | default('latest') | trim }}"

        if [ "$REQUESTED" = "latest" ]; then
          MANIFEST="$STORAGE_DIR/{{ orm_latest_manifest_name }}"

          [ -s "$MANIFEST" ] || {
            echo "Manifest latest não encontrado: $MANIFEST" >&2
            exit 10
          }

          head -n1 "$MANIFEST" | tr -d '\r\n'
        else
          case "$REQUESTED" in
            *.dmp)
              printf '%s\n' "$REQUESTED"
              ;;
            *)
              printf '%s.dmp\n' "$REQUESTED"
              ;;
          esac
        fi
      args:
        executable: /bin/bash
      register: _orm_restore_dump_name_resolved
      changed_when: false
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Validar nome retornado pelo manifesto/Survey
      ansible.builtin.assert:
        that:
          - _orm_restore_dump_name_resolved.stdout | trim | length > 0
          - (_orm_restore_dump_name_resolved.stdout | trim | basename) == (_orm_restore_dump_name_resolved.stdout | trim)
          - _orm_restore_dump_name_resolved.stdout | trim is match('^[A-Za-z0-9_.-]+\\.dmp$')
        fail_msg: >-
          Nome de dump inválido:
          {{ _orm_restore_dump_name_resolved.stdout | default('') | trim }}

    - name: Restore dump | Definir paths do dump compartilhado e staging local
      ansible.builtin.set_fact:
        orm_effective_dump_name: "{{ _orm_restore_dump_name_resolved.stdout | trim }}"
        orm_effective_dump_file: "{{ orm_restore_dir }}/{{ _orm_restore_dump_name_resolved.stdout | trim }}"
        orm_effective_dump_reference: >-
          {{
            (orm_dump_storage_protocol_effective | upper)
            ~ ':'
            ~ orm_dump_storage_label_effective
            ~ ':'
            ~ (orm_dump_storage_path | regex_replace('/$', ''))
            ~ '/'
            ~ (_orm_restore_dump_name_resolved.stdout | trim)
          }}
        orm_restore_dump_source: "{{ orm_dump_storage_protocol_effective | upper }} -> LOCAL"

    - name: Restore dump | Validar dump no storage compartilhado
      ansible.builtin.stat:
        path: "{{ orm_dump_storage_data_dir_effective }}/{{ orm_effective_dump_name }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: _orm_restore_shared_dump_stat
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Confirmar dump válido no storage compartilhado
      ansible.builtin.assert:
        that:
          - _orm_restore_shared_dump_stat.stat.exists | default(false)
          - _orm_restore_shared_dump_stat.stat.isreg | default(false)
          - _orm_restore_shared_dump_stat.stat.size | default(0) | int > 0
        fail_msg: >-
          Dump não encontrado ou vazio no storage {{ orm_dump_storage_protocol_effective | upper }}:
          {{ orm_dump_storage_data_dir_effective }}/{{ orm_effective_dump_name }}.

    - name: Restore dump | Copiar dump para restore.root_dir
      ansible.builtin.command:
        argv:
          - cp
          - -f
          - "{{ orm_dump_storage_data_dir_effective }}/{{ orm_effective_dump_name }}"
          - "{{ orm_effective_dump_file }}"
      become: true
      become_user: "{{ orm_os_user_effective }}"

  rescue:

    - name: Restore dump | Registrar falha de resolução/cópia do storage compartilhado
      ansible.builtin.set_fact:
        orm_host_failed: true
        orm_host_failed_task: "Resolver/copiar dump do storage compartilhado"
        orm_host_error_msg: >-
          {{
            ansible_failed_result.msg
            | default(
                ansible_failed_result.stderr
                | default('Falha ao resolver/copiar dump do storage compartilhado.')
              )
          }}

  always:

    - name: Restore dump | Desmontar storage compartilhado de staging
      ansible.builtin.import_tasks: 37_unmount_storage.yml


- name: Restore dump | Resolver dump diretamente no storage compartilhado
  when:
    - orm_restore_storage_mode == 'shared'
    - orm_dump_storage_enabled_effective | bool
    - not (orm_host_failed | bool)
  block:

    - name: Restore dump | Resolver nome efetivo no storage montado
      ansible.builtin.shell: |
        set -euo pipefail

        STORAGE_DIR="{{ orm_dump_storage_data_dir_effective }}"
        REQUESTED="{{ orm_restore_dump_name | default('latest') | trim }}"

        if [ "$REQUESTED" = "latest" ]; then
          MANIFEST="$STORAGE_DIR/{{ orm_latest_manifest_name }}"

          [ -s "$MANIFEST" ] || {
            echo "Manifest latest não encontrado: $MANIFEST" >&2
            exit 10
          }

          head -n1 "$MANIFEST" | tr -d '\r\n'
        else
          case "$REQUESTED" in
            *.dmp)
              printf '%s\n' "$REQUESTED"
              ;;
            *)
              printf '%s.dmp\n' "$REQUESTED"
              ;;
          esac
        fi
      args:
        executable: /bin/bash
      register: _orm_restore_dump_name_resolved
      changed_when: false
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Validar nome retornado pelo manifesto/Survey
      ansible.builtin.assert:
        that:
          - _orm_restore_dump_name_resolved.stdout | trim | length > 0
          - (_orm_restore_dump_name_resolved.stdout | trim | basename) == (_orm_restore_dump_name_resolved.stdout | trim)
          - _orm_restore_dump_name_resolved.stdout | trim is match('^[A-Za-z0-9_.-]+\\.dmp$')
        fail_msg: >-
          Nome de dump inválido:
          {{ _orm_restore_dump_name_resolved.stdout | default('') | trim }}

    - name: Restore dump | Definir dump compartilhado efetivo
      ansible.builtin.set_fact:
        orm_effective_dump_name: "{{ _orm_restore_dump_name_resolved.stdout | trim }}"
        orm_effective_dump_file: "{{ orm_dump_storage_data_dir_effective }}/{{ _orm_restore_dump_name_resolved.stdout | trim }}"
        orm_effective_dump_reference: >-
          {{
            (orm_dump_storage_protocol_effective | upper)
            ~ ':'
            ~ orm_dump_storage_label_effective
            ~ ':'
            ~ (orm_dump_storage_path | regex_replace('/$', ''))
            ~ '/'
            ~ (_orm_restore_dump_name_resolved.stdout | trim)
          }}
        orm_restore_dump_source: "{{ orm_dump_storage_protocol_effective | upper }} DIRETO"

    - name: Restore dump | Validar dump diretamente no storage compartilhado
      ansible.builtin.stat:
        path: "{{ orm_effective_dump_file }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: _orm_restore_shared_dump_stat
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Confirmar dump válido no storage compartilhado
      ansible.builtin.assert:
        that:
          - _orm_restore_shared_dump_stat.stat.exists | default(false)
          - _orm_restore_shared_dump_stat.stat.isreg | default(false)
          - _orm_restore_shared_dump_stat.stat.size | default(0) | int > 0
        fail_msg: >-
          Dump não encontrado ou vazio no storage {{ orm_dump_storage_protocol_effective | upper }}:
          {{ orm_effective_dump_file }}.

  rescue:

    - name: Restore dump | Registrar falha de resolução direta do storage compartilhado
      ansible.builtin.set_fact:
        orm_host_failed: true
        orm_host_failed_task: "Resolver dump diretamente do storage compartilhado"
        orm_host_error_msg: >-
          {{
            ansible_failed_result.msg
            | default(
                ansible_failed_result.stderr
                | default('Falha ao resolver dump diretamente do storage compartilhado.')
              )
          }}


- name: Restore dump | Resolver dump local quando storage compartilhado estiver desabilitado
  when:
    - orm_restore_storage_mode == 'local'
    - not (orm_dump_storage_enabled_effective | bool)
    - not (orm_host_failed | bool)
  block:

    - name: Restore dump | Resolver nome local
      ansible.builtin.shell: |
        set -euo pipefail

        REQUESTED="{{ orm_restore_dump_name | default('latest') | trim }}"

        if [ "$REQUESTED" = "latest" ]; then
          find "{{ orm_restore_dir }}" \
            -maxdepth 1 \
            -type f \
            -name '*.dmp' \
            -printf '%T@ %f\n' 2>/dev/null \
          | sort -nr \
          | head -n1 \
          | cut -d' ' -f2-
        else
          case "$REQUESTED" in
            *.dmp)
              printf '%s\n' "$REQUESTED"
              ;;
            *)
              printf '%s.dmp\n' "$REQUESTED"
              ;;
          esac
        fi
      args:
        executable: /bin/bash
      register: _orm_restore_local_name
      changed_when: false
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Validar nome local resolvido
      ansible.builtin.assert:
        that:
          - _orm_restore_local_name.stdout | trim | length > 0
          - (_orm_restore_local_name.stdout | trim | basename) == (_orm_restore_local_name.stdout | trim)
          - _orm_restore_local_name.stdout | trim is match('^[A-Za-z0-9_.-]+\\.dmp$')
        fail_msg: >-
          Nenhum dump .dmp foi encontrado em
          {{ orm_restore_dir }} para o restore.

    - name: Restore dump | Definir dump local efetivo
      ansible.builtin.set_fact:
        orm_effective_dump_name: "{{ _orm_restore_local_name.stdout | trim }}"
        orm_effective_dump_file: "{{ orm_restore_dir }}/{{ _orm_restore_local_name.stdout | trim }}"
        orm_effective_dump_reference: "{{ orm_restore_dir }}/{{ _orm_restore_local_name.stdout | trim }}"
        orm_restore_dump_source: "LOCAL"


- name: Restore dump | Validar dump final antes de qualquer ação destrutiva
  ansible.builtin.stat:
    path: "{{ orm_effective_dump_file }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _orm_restore_dump_stat
  become: true
  become_user: "{{ orm_os_user_effective }}"
  when: not (orm_host_failed | bool)

- name: Restore dump | Registrar falha quando dump final não for válido
  ansible.builtin.set_fact:
    orm_host_failed: true
    orm_host_failed_task: "Validar dump para restore"
    orm_host_error_msg: >-
      Dump de restore não existe, não é arquivo regular ou está vazio:
      {{ orm_effective_dump_reference | default(orm_effective_dump_file | default('não resolvido')) }}.
  when:
    - not (orm_host_failed | bool)
    - not (
        _orm_restore_dump_stat.stat.exists | default(false)
        and _orm_restore_dump_stat.stat.isreg | default(false)
        and (_orm_restore_dump_stat.stat.size | default(0) | int > 0)
      )

- name: Restore dump | Publicar tamanho do dump
  ansible.builtin.set_fact:
    orm_restore_dump_size_bytes: "{{ _orm_restore_dump_stat.stat.size | default(0) | int }}"
  when: not (orm_host_failed | bool)
