---
- name: Restore dump | Resolver dump via storage compartilhado com staging local
  when:
    - orm_restore_storage_mode == 'local'
    - orm_dump_storage_enabled_effective | bool
    - not (orm_host_failed | bool)
  block:

    - name: Restore dump | Montar storage compartilhado para staging
      ansible.builtin.import_tasks: 36_mount_storage.yml

    - name: Restore dump | Resolver arquivos efetivos no storage compartilhado
      ansible.builtin.shell: |
        set -euo pipefail

        STORAGE_DIR="{{ orm_dump_storage_data_dir_effective }}"
        REQUESTED="{{ orm_restore_dump_name | default('latest') | trim }}"
        MANIFEST="$STORAGE_DIR/{{ orm_latest_manifest_name }}"

        resolve_requested() {
          local requested="$1"

          if [ "$requested" = "latest" ]; then
            [ -s "$MANIFEST" ] || {
              echo "Manifest latest não encontrado: $MANIFEST" >&2
              exit 10
            }

            sed -e 's/\r$//' -e '/^[[:space:]]*$/d' "$MANIFEST"
            return
          fi

          case "$requested" in
            *.dmp) ;;
            *) requested="${requested}.dmp" ;;
          esac

          if [ -f "$STORAGE_DIR/$requested" ]; then
            if [[ "$requested" =~ ^(.+)_([0-9][0-9])\.dmp$ ]]; then
              prefix="${BASH_REMATCH[1]}"
              mapfile -t siblings < <(
                find "$STORAGE_DIR" -maxdepth 1 -type f -name "${prefix}_[0-9][0-9].dmp" -printf '%f\n' 2>/dev/null | sort
              )

              if [ -n "${siblings[1]:-}" ]; then
                printf '%s\n' "${siblings[@]}"
                return
              fi
            fi

            printf '%s\n' "$requested"
            return
          fi

          stem="${requested%.dmp}"
          mapfile -t parts < <(
            find "$STORAGE_DIR" -maxdepth 1 -type f -name "${stem}_[0-9][0-9].dmp" -printf '%f\n' 2>/dev/null | sort
          )

          [ -n "${parts[0]:-}" ] || {
            echo "Dump/dump set não encontrado para: $requested" >&2
            exit 11
          }

          printf '%s\n' "${parts[@]}"
        }

        resolve_requested "$REQUESTED"
      args:
        executable: /bin/bash
      register: _orm_restore_dump_names_resolved
      changed_when: false
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Publicar nomes resolvidos
      ansible.builtin.set_fact:
        orm_effective_dump_names: >-
          {{
            _orm_restore_dump_names_resolved.stdout_lines
            | default([])
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: Restore dump | Validar nomes retornados pelo manifesto/Survey
      ansible.builtin.assert:
        that:
          - item | basename == item
          - item is match('^[A-Za-z0-9_.-]+\.dmp$')
        fail_msg: "Nome de dump inválido: {{ item }}"
      loop: "{{ orm_effective_dump_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Restore dump | Validar que ao menos um arquivo foi resolvido
      ansible.builtin.assert:
        that:
          - orm_effective_dump_names | length > 0
        fail_msg: "Nenhum arquivo de dump foi resolvido para o restore."

    - name: Restore dump | Definir identidade lógica do dump set
      ansible.builtin.set_fact:
        orm_effective_dump_name: >-
          {{
            (orm_effective_dump_names | first | regex_replace('_[0-9]{2}\\.dmp$', '.dmp'))
            if orm_effective_dump_names | length > 1
            else (orm_effective_dump_names | first)
          }}
        orm_effective_dump_reference: >-
          {{
            (orm_dump_storage_protocol_effective | upper)
            ~ ':'
            ~ orm_dump_storage_label_effective
            ~ ':'
            ~ (orm_dump_storage_path | regex_replace('/$', ''))
            ~ '/'
            ~ (
                (orm_effective_dump_names | first | regex_replace('_[0-9]{2}\\.dmp$', '.dmp'))
                if orm_effective_dump_names | length > 1
                else (orm_effective_dump_names | first)
              )
          }}
        orm_restore_dump_source: "{{ orm_dump_storage_protocol_effective | upper }} -> LOCAL"

    - name: Restore dump | Validar arquivos no storage compartilhado
      ansible.builtin.stat:
        path: "{{ orm_dump_storage_data_dir_effective }}/{{ item }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ orm_effective_dump_names }}"
      loop_control:
        label: "{{ item }}"
      register: _orm_restore_shared_dump_stats
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Confirmar arquivos válidos no storage compartilhado
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) | int > 0
        fail_msg: >-
          Dump não encontrado ou vazio no storage {{ orm_dump_storage_protocol_effective | upper }}:
          {{ item.item }}.
      loop: "{{ _orm_restore_shared_dump_stats.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('dump') }}"

    - name: Restore dump | Copiar arquivos para restore.root_dir
      ansible.builtin.command:
        argv:
          - cp
          - -f
          - "{{ orm_dump_storage_data_dir_effective }}/{{ item }}"
          - "{{ orm_restore_dir }}/{{ item }}"
      loop: "{{ orm_effective_dump_names }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Publicar paths locais do dump set
      ansible.builtin.set_fact:
        orm_effective_dump_files: >-
          {%- set out = [] -%}
          {%- for dump_name in orm_effective_dump_names -%}
            {%- set _ = out.append(orm_restore_dir ~ '/' ~ dump_name) -%}
          {%- endfor -%}
          {{ out }}
        orm_effective_dump_file: "{{ orm_restore_dir }}/{{ orm_effective_dump_names | first }}"

  rescue:

    - name: Restore dump | Registrar falha de resolução/cópia do storage compartilhado
      ansible.builtin.set_fact:
        orm_host_failed: true
        orm_host_failed_task: "Resolver/copiar dump do storage compartilhado"
        orm_host_error_msg: >-
          {{
            ansible_failed_result.msg
            | default(
                ansible_failed_result.stderr
                | default('Falha ao resolver/copiar dump do storage compartilhado.')
              )
          }}

  always:

    - name: Restore dump | Desmontar storage compartilhado de staging
      ansible.builtin.import_tasks: 37_unmount_storage.yml


- name: Restore dump | Resolver dump diretamente no storage compartilhado
  when:
    - orm_restore_storage_mode == 'shared'
    - orm_dump_storage_enabled_effective | bool
    - not (orm_host_failed | bool)
  block:

    - name: Restore dump | Resolver arquivos efetivos no storage montado
      ansible.builtin.shell: |
        set -euo pipefail

        STORAGE_DIR="{{ orm_dump_storage_data_dir_effective }}"
        REQUESTED="{{ orm_restore_dump_name | default('latest') | trim }}"
        MANIFEST="$STORAGE_DIR/{{ orm_latest_manifest_name }}"

