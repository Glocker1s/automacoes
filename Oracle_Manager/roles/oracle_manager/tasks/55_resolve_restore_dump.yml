                return
              fi
            fi

            printf '%s\n' "$requested"
            return
          fi

          stem="${requested%.dmp}"
          mapfile -t parts < <(
            find "$STORAGE_DIR" -maxdepth 1 -type f -name "${stem}_[0-9][0-9].dmp" -printf '%f\n' 2>/dev/null | sort
          )

          [ -n "${parts[0]:-}" ] || {
            echo "Dump/dump set não encontrado para: $requested" >&2
            exit 11
          }

          printf '%s\n' "${parts[@]}"
