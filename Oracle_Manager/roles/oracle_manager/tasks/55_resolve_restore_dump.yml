      loop: "{{ orm_effective_dump_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Restore dump | Validar que ao menos um arquivo foi resolvido
      ansible.builtin.assert:
        that:
          - orm_effective_dump_names | length > 0
        fail_msg: "Nenhum arquivo de dump foi resolvido para o restore."

    - name: Restore dump | Definir dump compartilhado efetivo
      ansible.builtin.set_fact:
        orm_effective_dump_name: >-
          {{
            (orm_effective_dump_names | first | regex_replace('_[0-9]{2}\\.dmp$', '.dmp'))
            if orm_effective_dump_names | length > 1
            else (orm_effective_dump_names | first)
          }}
        orm_effective_dump_files: >-
          {%- set out = [] -%}
          {%- for dump_name in orm_effective_dump_names -%}
            {%- set _ = out.append(orm_dump_storage_data_dir_effective ~ '/' ~ dump_name) -%}
          {%- endfor -%}
          {{ out }}
        orm_effective_dump_file: "{{ orm_dump_storage_data_dir_effective }}/{{ orm_effective_dump_names | first }}"
        orm_effective_dump_reference: >-
          {{
            (orm_dump_storage_protocol_effective | upper)
            ~ ':'
            ~ orm_dump_storage_label_effective
            ~ ':'
            ~ (orm_dump_storage_path | regex_replace('/$', ''))
            ~ '/'
            ~ (
                (orm_effective_dump_names | first | regex_replace('_[0-9]{2}\\.dmp$', '.dmp'))
                if orm_effective_dump_names | length > 1
                else (orm_effective_dump_names | first)
              )
          }}
        orm_restore_dump_source: "{{ orm_dump_storage_protocol_effective | upper }} DIRETO"

  rescue:

    - name: Restore dump | Registrar falha de resolução direta do storage compartilhado
      ansible.builtin.set_fact:
        orm_host_failed: true
        orm_host_failed_task: "Resolver dump diretamente do storage compartilhado"
        orm_host_error_msg: >-
          {{
            ansible_failed_result.msg
            | default(
                ansible_failed_result.stderr
                | default('Falha ao resolver dump diretamente do storage compartilhado.')
              )
          }}


- name: Restore dump | Resolver dump local quando storage compartilhado estiver desabilitado
  when:
    - orm_restore_storage_mode == 'local'
    - not (orm_dump_storage_enabled_effective | bool)
    - not (orm_host_failed | bool)
  block:

    - name: Restore dump | Resolver arquivos locais
      ansible.builtin.shell: |
        set -euo pipefail

        STORAGE_DIR="{{ orm_restore_dir }}"
        REQUESTED="{{ orm_restore_dump_name | default('latest') | trim }}"

        resolve_requested() {
          local requested="$1"

          if [ "$requested" = "latest" ]; then
            newest="$(
              find "$STORAGE_DIR" -maxdepth 1 -type f -name '*.dmp' -printf '%T@ %f\n' 2>/dev/null \
              | sort -nr \
              | head -n1 \
              | cut -d' ' -f2-
            )"

            [ -n "$newest" ] || exit 10
            requested="$newest"
          else
            case "$requested" in
              *.dmp) ;;
              *) requested="${requested}.dmp" ;;
            esac
          fi

          if [ -f "$STORAGE_DIR/$requested" ]; then
            if [[ "$requested" =~ ^(.+)_([0-9][0-9])\.dmp$ ]]; then
              prefix="${BASH_REMATCH[1]}"
              mapfile -t siblings < <(
                find "$STORAGE_DIR" -maxdepth 1 -type f -name "${prefix}_[0-9][0-9].dmp" -printf '%f\n' 2>/dev/null | sort
              )

              if [ -n "${siblings[1]:-}" ]; then
                printf '%s\n' "${siblings[@]}"
                return
              fi
            fi

            printf '%s\n' "$requested"
            return
          fi

          stem="${requested%.dmp}"
          mapfile -t parts < <(
            find "$STORAGE_DIR" -maxdepth 1 -type f -name "${stem}_[0-9][0-9].dmp" -printf '%f\n' 2>/dev/null | sort
          )

          [ -n "${parts[0]:-}" ] || exit 11
          printf '%s\n' "${parts[@]}"
        }

        resolve_requested "$REQUESTED"
      args:
        executable: /bin/bash
      register: _orm_restore_local_names
      changed_when: false
      become: true
      become_user: "{{ orm_os_user_effective }}"

    - name: Restore dump | Publicar nomes locais resolvidos
      ansible.builtin.set_fact:
        orm_effective_dump_names: >-
          {{
            _orm_restore_local_names.stdout_lines
            | default([])
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: Restore dump | Validar nomes locais resolvidos
      ansible.builtin.assert:
        that:
          - item | basename == item
          - item is match('^[A-Za-z0-9_.-]+\.dmp$')
        fail_msg: "Nome de dump local inválido: {{ item }}"
      loop: "{{ orm_effective_dump_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Restore dump | Validar que ao menos um arquivo local foi resolvido
      ansible.builtin.assert:
        that:
          - orm_effective_dump_names | length > 0
        fail_msg: "Nenhum dump .dmp foi encontrado em {{ orm_restore_dir }} para o restore."

    - name: Restore dump | Definir dump local efetivo
      ansible.builtin.set_fact:
        orm_effective_dump_name: >-
          {{
            (orm_effective_dump_names | first | regex_replace('_[0-9]{2}\\.dmp$', '.dmp'))
            if orm_effective_dump_names | length > 1
            else (orm_effective_dump_names | first)
          }}
        orm_effective_dump_files: >-
          {%- set out = [] -%}
          {%- for dump_name in orm_effective_dump_names -%}
            {%- set _ = out.append(orm_restore_dir ~ '/' ~ dump_name) -%}
          {%- endfor -%}
          {{ out }}
        orm_effective_dump_file: "{{ orm_restore_dir }}/{{ orm_effective_dump_names | first }}"
        orm_effective_dump_reference: >-
          {{
            orm_restore_dir
            ~ '/'
            ~ (
                (orm_effective_dump_names | first | regex_replace('_[0-9]{2}\\.dmp$', '.dmp'))
                if orm_effective_dump_names | length > 1
                else (orm_effective_dump_names | first)
              )
          }}
        orm_restore_dump_source: "LOCAL"


- name: Restore dump | Validar arquivos finais antes de qualquer ação destrutiva
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ orm_effective_dump_files }}"
  loop_control:
    label: "{{ item | basename }}"
  register: _orm_restore_dump_stats
  become: true
  become_user: "{{ orm_os_user_effective }}"
  when: not (orm_host_failed | bool)

- name: Restore dump | Registrar falha quando algum arquivo final não for válido
  ansible.builtin.set_fact:
    orm_host_failed: true
    orm_host_failed_task: "Validar dump para restore"
    orm_host_error_msg: >-
      Um ou mais arquivos do dump de restore não existem, não são regulares ou estão vazios.
      Dump={{ orm_effective_dump_reference | default('não resolvido') }}.
  when:
    - not (orm_host_failed | bool)
    - >-
      (
        _orm_restore_dump_stats.results
        | default([])
        | rejectattr('stat.exists', 'defined')
        | list
        | length > 0
      )
      or
      (
        _orm_restore_dump_stats.results
        | default([])
        | selectattr('stat.exists', 'defined')
        | selectattr('stat.exists', 'equalto', false)
        | list
        | length > 0
      )
      or
      (
        _orm_restore_dump_stats.results
        | default([])
        | selectattr('stat.isreg', 'defined')
        | selectattr('stat.isreg', 'equalto', false)
        | list
        | length > 0
      )
      or
      (
        _orm_restore_dump_stats.results
        | default([])
        | selectattr('stat.size', 'defined')
        | selectattr('stat.size', 'equalto', 0)
        | list
        | length > 0
      )

- name: Restore dump | Publicar tamanho total e quantidade de arquivos
  ansible.builtin.set_fact:
    orm_restore_dump_size_bytes: >-
      {{
        _orm_restore_dump_stats.results
        | default([])
        | map(attribute='stat')
        | selectattr('size', 'defined')
        | map(attribute='size')
        | map('int')
        | sum
      }}
    orm_restore_dump_files_count: "{{ orm_effective_dump_names | length }}"
  when: not (orm_host_failed | bool)
