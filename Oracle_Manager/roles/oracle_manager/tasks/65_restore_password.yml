---
- name: Password | Alterar senha de destino e desbloquear usuário
  ansible.builtin.shell: |
    PDB="{{ orm_pdb_effective | default('') }}"
    if [ -n "$PDB" ]; then
      export ORACLE_PDB_SID="$PDB"
    else
      unset ORACLE_PDB_SID
    fi

    "{{ orm_oracle_home_effective }}/bin/sqlplus" -s "/ as sysdba" <<'SQL'
    whenever sqlerror exit sql.sqlcode
    alter user "{{ item }}" identified by "{{ _orm_schema_password_sql }}" account unlock;
    exit
    SQL
  environment:
    ORACLE_SID: "{{ orm_sid_effective }}"
    ORACLE_HOME: "{{ orm_oracle_home_effective }}"
    PATH: "{{ orm_oracle_home_effective }}/bin:/usr/local/bin:/usr/bin:/bin"
  vars:
    _orm_schema_user_cfg: >-
      {{
        (orm_profile_cfg.users | default({})).get(
          item,
          (orm_profile_cfg.users | default({})).get(item | upper, {})
        )
      }}
    _orm_schema_password_var: "{{ _orm_schema_user_cfg.password_var | default('') }}"
    _orm_schema_password: "{{ vars.get(_orm_schema_password_var, '') | string }}"
    _orm_schema_password_sql: >-
      {{ _orm_schema_password | replace('"', '""') }}
  loop: "{{ orm_schemas }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_user: "{{ orm_os_user_effective }}"
  no_log: true
  when:
    - orm_restore_unlock_users | bool
    - _orm_schema_password | length > 0

- name: Password | Apenas desbloquear usuário quando senha não é obrigatória
  ansible.builtin.shell: |
    PDB="{{ orm_pdb_effective | default('') }}"
    if [ -n "$PDB" ]; then
      export ORACLE_PDB_SID="$PDB"
    else
      unset ORACLE_PDB_SID
    fi

    "{{ orm_oracle_home_effective }}/bin/sqlplus" -s "/ as sysdba" <<'SQL'
    whenever sqlerror exit sql.sqlcode
    alter user "{{ item }}" account unlock;
    exit
    SQL
  environment:
    ORACLE_SID: "{{ orm_sid_effective }}"
    ORACLE_HOME: "{{ orm_oracle_home_effective }}"
    PATH: "{{ orm_oracle_home_effective }}/bin:/usr/local/bin:/usr/bin:/bin"
  vars:
    _orm_schema_user_cfg: >-
      {{
        (orm_profile_cfg.users | default({})).get(
          item,
          (orm_profile_cfg.users | default({})).get(item | upper, {})
        )
      }}
    _orm_schema_password_var: "{{ _orm_schema_user_cfg.password_var | default('') }}"
    _orm_schema_password: "{{ vars.get(_orm_schema_password_var, '') | string }}"
  loop: "{{ orm_schemas }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_user: "{{ orm_os_user_effective }}"
  when:
    - orm_restore_unlock_users | bool
    - not (orm_restore_require_password | bool)
    - _orm_schema_password | length == 0