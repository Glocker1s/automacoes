---
- name: Password | Alterar senha de destino e desbloquear usuário
  ansible.builtin.shell:
    cmd: |
      PDB="{{ orm_pdb_effective | default('') }}"
      if [ -n "$PDB" ]; then
        export ORACLE_PDB_SID="$PDB"
      else
        unset ORACLE_PDB_SID
      fi

      PASSWORD_SQL="$(printf '%s' "$ORM_RESTORE_PASSWORD" | sed 's/"/""/g')"

      if [ "{{ orm_restore_unlock_users | bool | ternary('true', 'false') }}" = "true" ]; then
        UNLOCK_CLAUSE=" account unlock"
      else
        UNLOCK_CLAUSE=""
      fi

      "{{ orm_oracle_home_effective }}/bin/sqlplus" -s "/ as sysdba" <<SQL
      whenever sqlerror exit sql.sqlcode
      alter user "{{ item }}" identified by "$PASSWORD_SQL"$UNLOCK_CLAUSE;
      exit
      SQL
    executable: /bin/bash
  environment:
    ORACLE_SID: "{{ orm_sid_effective }}"
    ORACLE_HOME: "{{ orm_oracle_home_effective }}"
    PATH: "{{ orm_oracle_home_effective }}/bin:/usr/local/bin:/usr/bin:/bin"
    ORM_RESTORE_PASSWORD: "{{ orm_restore_password_effective }}"
  loop: "{{ orm_schemas }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_user: "{{ orm_os_user_effective }}"
  no_log: true
  when: orm_restore_password_effective | default('') | length > 0

- name: Password | Apenas desbloquear usuário quando senha não é obrigatória
  ansible.builtin.shell:
    cmd: |
      PDB="{{ orm_pdb_effective | default('') }}"
      if [ -n "$PDB" ]; then
        export ORACLE_PDB_SID="$PDB"
      else
        unset ORACLE_PDB_SID
      fi

      "{{ orm_oracle_home_effective }}/bin/sqlplus" -s "/ as sysdba" <<'SQL'
      whenever sqlerror exit sql.sqlcode
      alter user "{{ item }}" account unlock;
      exit
      SQL
    executable: /bin/bash
  environment:
    ORACLE_SID: "{{ orm_sid_effective }}"
    ORACLE_HOME: "{{ orm_oracle_home_effective }}"
    PATH: "{{ orm_oracle_home_effective }}/bin:/usr/local/bin:/usr/bin:/bin"
  loop: "{{ orm_schemas }}"
  loop_control:
    label: "{{ item }}"
  become: true
  become_user: "{{ orm_os_user_effective }}"
  when:
    - orm_restore_password_effective | default('') | length == 0
    - orm_restore_unlock_users | bool
