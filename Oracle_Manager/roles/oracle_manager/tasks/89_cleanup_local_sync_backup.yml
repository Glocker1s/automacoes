---
- name: Local cleanup | Inicializar estado
  ansible.builtin.set_fact:
    orm_local_cleanup_failed: false
    orm_local_cleanup_error: ""
    orm_local_cleanup_performed: false
    orm_local_cleanup_errors: []
    _orm_local_cleanup_action: "{{ orm_action_normalized | default(orm_action | default('backup') | lower) }}"

- name: Local cleanup | Resolver hosts do sync
  ansible.builtin.set_fact:
    _orm_local_cleanup_source_hosts: "{{ groups.orm_source_targets | default([]) }}"
    _orm_local_cleanup_required_hosts: "{{ ((groups.orm_source_targets | default([])) + (groups.orm_restore_targets | default([]))) | unique | list }}"
    _orm_local_cleanup_not_success_hosts: []
  when:
    - orm_cleanup_local_backup_after_sync | bool
    - _orm_local_cleanup_action == 'sync'

- name: Local cleanup | Identificar hosts sem sucesso
  ansible.builtin.set_fact:
    _orm_local_cleanup_not_success_hosts: "{{ _orm_local_cleanup_not_success_hosts + [item] }}"
  loop: "{{ _orm_local_cleanup_required_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - orm_cleanup_local_backup_after_sync | bool
    - _orm_local_cleanup_action == 'sync'
    - hostvars[item].orm_host_status | default('NÃO EXECUTADO') != 'SUCESSO'

- name: Local cleanup | Informar retenção por falha operacional
  ansible.builtin.debug:
    msg: >-
      Backup local do sync mantido porque nem todos os hosts terminaram com SUCESSO:
      {{ _orm_local_cleanup_not_success_hosts | join(', ') }}.
  when:
    - orm_cleanup_local_backup_after_sync | bool
    - _orm_local_cleanup_action == 'sync'
    - _orm_local_cleanup_not_success_hosts | default([]) | length > 0

- name: Local cleanup | Informar retenção por falha no cleanup CIFS
  ansible.builtin.debug:
    msg: "Backup local do sync mantido porque o cleanup do CIFS apresentou falha."
  when:
    - orm_cleanup_local_backup_after_sync | bool
    - _orm_local_cleanup_action == 'sync'
    - _orm_local_cleanup_not_success_hosts | default([]) | length == 0
    - orm_cifs_cleanup_failed | default(false) | bool

- name: Local cleanup | Remover artefatos do backup da origem
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT="{{ (hostvars[item].orm_host_summary | default({})).get('root_dir', '') }}"
    DUMP_FILE="{{ (hostvars[item].orm_host_summary | default({})).get('dump_file', '') }}"
    LOG_FILE="{{ (hostvars[item].orm_host_summary | default({})).get('datapump_log', '') }}"
    CONTROL_LOG="{{ (hostvars[item].orm_host_summary | default({})).get('control_log', '') }}"
    PARFILE="{{ hostvars[item].orm_expdp_parfile | default('') }}"
    MANIFEST="{{ hostvars[item].orm_latest_manifest_file | default('') }}"
    DUMP_NAME="{{ (hostvars[item].orm_host_summary | default({})).get('dump', '') }}"
    JOB_ID="{{ awx_job_id | default(tower_job_id | default('manual')) }}"

    if [ -z "$ROOT" ] || [ -z "$DUMP_FILE" ] || [ -z "$DUMP_NAME" ]; then
      echo "Informações insuficientes para cleanup local do host {{ item }}." >&2
      exit 20
    fi

    for FILE in "$DUMP_FILE" "$LOG_FILE" "$CONTROL_LOG" "$PARFILE"; do
      [ -n "$FILE" ] || continue
      case "$FILE" in
        "$ROOT"/*)
          if [ -f "$FILE" ]; then
            rm -f -- "$FILE"
            echo "__FILE_REMOVED__=$FILE"
          fi
          ;;
        *)
          echo "Arquivo fora do backup.root_dir; cleanup recusado: $FILE" >&2
          exit 21
          ;;
      esac
    done

    if [ -d "$ROOT" ]; then
      find "$ROOT" -mindepth 1 -maxdepth 1 \
        -name "*job_${JOB_ID}*" \
        -print \
        -exec rm -rf -- {} +
    fi

    if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
      LATEST="$(head -n1 "$MANIFEST" | tr -d '\r' | xargs)"
      if [ "$LATEST" = "$DUMP_NAME" ]; then
        rm -f "$MANIFEST"
        echo "__LATEST_REMOVED__=true"
      else
        echo "__LATEST_KEPT__=$LATEST"
      fi
    fi

    echo "__CLEANUP_DONE__=true"
  args:
    executable: /bin/bash
  loop: "{{ _orm_local_cleanup_source_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _orm_local_cleanup_exec
  delegate_to: "{{ item }}"
  become: true
  failed_when: false
  changed_when: "'__CLEANUP_DONE__=true' in (_orm_local_cleanup_exec.stdout | default(''))"
  when:
    - orm_cleanup_local_backup_after_sync | bool
    - _orm_local_cleanup_action == 'sync'
    - _orm_local_cleanup_not_success_hosts | default([]) | length == 0
    - not (orm_cifs_cleanup_failed | default(false) | bool)

- name: Local cleanup | Registrar erros
  ansible.builtin.set_fact:
    orm_local_cleanup_failed: true
    orm_local_cleanup_errors: >-
      {{ orm_local_cleanup_errors + [item.item ~ ': ' ~ (item.stderr | default(item.stdout | default('Falha no cleanup local.')))] }}
  loop: "{{ _orm_local_cleanup_exec.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('host') }}"
  when:
    - item.rc | default(0) | int != 0

- name: Local cleanup | Publicar resultado
  ansible.builtin.set_fact:
    orm_local_cleanup_performed: "{{ (_orm_local_cleanup_exec.results | default([]) | length) > 0 }}"
    orm_local_cleanup_error: "{{ orm_local_cleanup_errors | join(' | ') }}"

- name: Local cleanup | Exibir resultado
  ansible.builtin.debug:
    msg:
      action: "{{ _orm_local_cleanup_action }}"
      performed: "{{ orm_local_cleanup_performed }}"
      failed: "{{ orm_local_cleanup_failed }}"
      error: "{{ orm_local_cleanup_error }}"
  when:
    - orm_cleanup_local_backup_after_sync | bool
    - _orm_local_cleanup_action == 'sync'
