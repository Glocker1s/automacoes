---
- name: Shared storage | Desmontar compartilhamento
  ansible.builtin.shell: |
    if mountpoint -q "{{ orm_dump_storage_mount_dir }}"; then
      umount "{{ orm_dump_storage_mount_dir }}" || true
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: root
  changed_when: false
  failed_when: false

- name: Shared storage | Remover arquivo temporário de senha CIFS
  ansible.builtin.file:
    path: "{{ orm_cifs_password_file }}"
    state: absent
  become: true
  become_user: root
  failed_when: false
  no_log: true
  when: >-
    (orm_shared_storage_protocol_mounted | default(orm_dump_storage_protocol_effective | default(orm_dump_storage_protocol_normalized | default(orm_dump_storage_protocol | default('cifs')))) | string | lower | trim) == 'cifs'

- name: Shared storage | Registrar montagem encerrada
  ansible.builtin.set_fact:
    orm_shared_storage_mounted: false
